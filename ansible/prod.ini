# Production Environment Inventory - 3-Tier Architecture  
# shared-jumpbox를 통한 ProxyJump로 내부 서버 접근

[jumpbox]
shared-jumpbox ansible_host=34.22.110.81 ansible_user=lsh

[backend]
prod-backend ansible_host=10.1.0.3 ansible_user=ubuntu

[ai]
prod-ai ansible_host=10.1.0.4 ansible_user=ubuntu

[database] 
prod-database ansible_host=10.1.0.2 ansible_user=ubuntu

# 그룹 계층 정의 - prod 환경의 하위 그룹들
[prod:children]
jumpbox
backend
ai
database

# 논리적 그룹핑
[internal_servers:children]
backend
ai
database

[app_servers:children]
backend
ai

[data_servers:children]
database

# 변수 설정 - Jump Box를 통한 ProxyJump
[prod:vars]
env=prod
ansible_ssh_private_key_file=~/.ssh/lsh-study-key

# 인프라 IP 설정 (Terraform에서 생성된 IP들)
# 내부 VM IP들 (prod 대역)
internal_ip_database=10.1.0.2
internal_ip_backend=10.1.0.3
internal_ip_ai=10.1.0.4

# 외부 서비스 IP들 (Terraform outputs)
load_balancer_ip=34.8.174.93
jumpbox_ip=34.22.110.81
wireguard_server_ip=34.22.110.81

# SSH 설정 - ProxyJump를 통한 내부 서버 접근
[internal_servers:vars]
ansible_ssh_common_args='-o ProxyJump="lsh@34.22.110.81" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=3'

# Jump Box 설정
[jumpbox:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=3'
