# Test Environment Inventory - 3-Tier Architecture  
# shared-jumpbox를 통한 ProxyJump로 내부 서버 접근

[jumpbox]
shared-jumpbox ansible_host=34.22.110.81 ansible_user=lsh

[backend]
test-backend ansible_host=10.0.0.3 ansible_user=ubuntu

[ai]
test-ai ansible_host=10.0.0.4 ansible_user=ubuntu

[database] 
test-database ansible_host=10.0.0.2 ansible_user=ubuntu

# 그룹 계층 정의 - test 환경의 하위 그룹들
[test:children]
jumpbox
backend
ai
database

# 논리적 그룹핑
[internal_servers:children]
backend
ai
database

[app_servers:children]
backend
ai

[data_servers:children]
database

# 변수 설정 - Jump Box를 통한 ProxyJump
[test:vars]
env=test
ansible_ssh_private_key_file=~/.ssh/lsh-study-key

# 인프라 IP 설정 (Terraform에서 생성된 IP들)
# 내부 VM IP들
internal_ip_database=10.0.0.2
internal_ip_backend=10.0.0.3
internal_ip_ai=10.0.0.4

# 외부 서비스 IP들 (Terraform outputs)
cdn_ip=34.8.153.188
jumpbox_ip=34.22.110.81
wireguard_server_ip=34.22.110.81

# Jump Box 변수
[jumpbox:vars]
service_name=jumpbox
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# 내부 서버들은 shared-jumpbox를 통해 접근 (SSH Agent forwarding 사용)
[internal_servers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ForwardAgent=yes -o ProxyJump=lsh@34.22.110.81'

[backend:vars]
service_port=8080

[ai:vars]
service_port=8100

[database:vars]
service_port=3306

# WireGuard VPN 설정 (각 서버의 VPN IP)
test-backend wireguard_ip=10.8.0.20
test-ai wireguard_ip=10.8.0.30
test-database wireguard_ip=10.8.0.40
