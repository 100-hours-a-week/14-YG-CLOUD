# Development 환경 변수 설정 (prod 구조 기반)
ansible_python_interpreter: /usr/bin/python3

# 기본 환경 설정
service_name: moongsan
env: dev
branch: dev # dev 환경은 dev 브랜치 사용

# 네트워크 정보 (dev 환경 - 단일 서버)
internal_ips:
  database: "172.21.0.1" # Docker bridge IP
  backend: "172.21.0.1"
  ai: "172.21.0.1"

# 애플리케이션 포트
app_ports:
  backend: 8080
  ai: 8100
  mysql: 3306
  redis: 6379
  mongo: 27017
  fe: 80

# 시스템 사용자 및 서비스 설정
system:
  user: ubuntu

# 배포 설정 (임시 조치)
deployment:
  remove_validation_annotations: true # @ProfanitySafe, @XssSafe 어노테이션 제거 여부

# 프로젝트 경로 (상위 레벨 변수 참조)
paths:
  base: "/var/{{ service_name }}"
  log: "/var/{{ service_name }}/log"
  backup: "/var/{{ service_name }}/backup"
  script: "/var/{{ service_name }}/script"
  secret: "/var/{{ service_name }}/secret"
  nginx: "/var/www/react"

# 프로젝트 저장소
project_paths:
  be_repo: "/home/{{ system.user }}/14-YG-BE"
  ai_repo: "/home/{{ system.user }}/14-YG-AI"
  fe_repo: "/home/lsh/14-YG-FE"
  cloud_repo: "/tmp/14-YG-CLOUD"

project_repos:
  be_url: "https://github.com/100-hours-a-week/14-YG-BE.git"
  ai_url: "https://github.com/100-hours-a-week/14-YG-AI.git"
  fe_url: "https://github.com/100-hours-a-week/14-YG-FE.git"
  cloud_url: "https://github.com/100-hours-a-week/14-YG-CLOUD.git"
  cloud_branch: "main" # 운영환경은 main 브랜치

# Nginx 설정 (dev 도메인)
nginx:
  domain: "dev.moongsan.com"
  ssl_email: nangmannsh@gmail.com
  devuser: devuser
  devuser_password: "{{ vault_nginx_dev_password }}" # Vault로 관리

# 데이터베이스 설정 (통합) - 운영 환경 최적화
db:
  # MySQL 설정
  mysql:
    name: "{{ service_name }}_{{ env }}_db"
    url: "jdbc:mysql://172.21.0.1:{{ app_ports.mysql }}/{{ service_name }}_{{ env }}_db?serverTimezone=Asia/Seoul"
    user: "{{ service_name }}_admin"
    password: "{{ vault_mysql_dev_password }}" # Vault로 관리
    driver: com.mysql.cj.jdbc.Driver
    root_user: root
    root_password: "{{ vault_mysql_root_dev_password }}" # Vault로 관리
    host: "{{ internal_ips.database }}"
    port: "{{ app_ports.mysql }}"

    # Performance settings - 운영 환경 최적화
    performance:
      max_connections: 1000 # 운영환경 더 많은 연결 허용
      max_connect_errors: 10000 # Allow more connection retries
      connect_timeout: 30 # Connection timeout in seconds
      wait_timeout: 28800 # 8 hours for long polling
      interactive_timeout: 28800 # 8 hours for interactive sessions
      table_open_cache: 8000 # 운영환경 더 많은 테이블 캐시
      table_definition_cache: 2800 # 운영환경 더 많은 테이블 정의 캐시
      tmp_table_size: "128M" # 운영환경 더 큰 임시 테이블
      max_heap_table_size: "128M" # 운영환경 더 큰 메모리 테이블
      thread_cache_size: 100 # 운영환경 더 많은 스레드 캐시
      thread_stack: "256K" # Stack size for each thread

    # Character set and collation
    charset:
      server: "utf8mb4" # Full UTF-8 support
      collation: "utf8mb4_unicode_ci" # Unicode collation

    # InnoDB storage engine settings - 운영 환경 최적화
    innodb:
      buffer_pool_size: "512M" # 운영환경 더 큰 버퍼 풀
      log_file_size: "128M" # 운영환경 더 큰 로그 파일
      flush_method: "O_DIRECT" # Direct I/O for better performance
      lock_wait_timeout: 50 # InnoDB lock wait timeout

    # Network settings
    network:
      max_allowed_packet: "128M" # 운영환경 더 큰 패킷 크기
      bind_address: "0.0.0.0" # Bind to all interfaces

    # Logging configuration - 운영 환경 세밀한 로깅
    logging:
      error_log: "/var/log/mysql/error.log"
      slow_query_log: 1 # Enable slow query logging
      slow_query_log_file: "/var/log/mysql/slow.log"
      long_query_time: 2 # 운영환경 더 엄격한 슬로우 쿼리 기준

    # Replication settings
    replication:
      server_id: 1 # Unique server identifier
      log_bin: "mysql-bin" # Binary log file prefix
      binlog_format: "ROW" # Binary log format

    # Security settings - 운영 환경 보안 강화
    security:
      sql_mode: "STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO"

    # Timezone setting
    timezone: "+09:00" # Asia/Seoul timezone

    # Container settings
    container:
      name: "mysql-{{ service_name }}"
      image: "mysql:8.0"
      restart_policy: "always"
      data_dir: "/var/lib/mysql-data"
      config_dir: "/etc/mysql/conf.d"

  # Redis 설정 - 운영 환경
  redis:
    image: "redis:7.2-alpine"
    container_name: "redis-{{ service_name }}"
    host: "redis-{{ service_name }}"
    port: "{{ app_ports.redis }}"
    # Master mode configuration
    mode: "master"
    # 운영 환경 Redis 패스워드 설정 (현재는 test와 동일하게 미사용)
    # password: "{{ vault_redis_prod_password }}"
    # Container settings
    container:
      data_dir: "/var/lib/redis-data"
      config_dir: "/etc/redis"
      config_file: "/etc/redis/redis.conf"

  # MongoDB 설정 - 운영 환경
  mongo:
    image: "mongo"
    tag: "6.0.7"
    container_name: "mongo-{{ service_name }}"
    host: "mongo-{{ service_name }}"
    port: "{{ app_ports.mongo }}"
    # 운영 환경 MongoDB 인증 설정 (현재는 test와 동일하게 미사용)
    # auth:
    #   enabled: true
    #   username: "{{ service_name }}_admin"
    #   password: "{{ vault_mongo_prod_password }}"
    #   database: "{{ service_name }}_{{ env }}_db"

dockerhub:
  username: himello
  password: "{{ vault_dockerhub_password }}"

# 프론트엔드 설정 (운영 환경)
fe:
  port: "{{ app_ports.fe }}"
  # OAuth 설정 (운영 환경)
  oauth:
    kakao:
      client_id: "{{ vault_kakao_client_id }}"
      redirect_uri: "https://{{ nginx.domain }}/kakao/callback"
      complete_redirect_uri: "https://{{ nginx.domain }}/kakao/callback/complete"

  # 빌드 설정
  build:
    build_command: "npm run build"
    build_dir: "dist"
    env_file: ".env.production"

  # API 엔드포인트 설정
  api:
    base_url: "https://{{ nginx.domain }}"
    backend_url: "https://{{ nginx.domain }}/api/"
    ai_url: "https://{{ nginx.domain }}/generation"
    domain: "{{ nginx.domain }}"

# 백엔드 설정 (운영 환경)
be:
  image: "{{ dockerhub.username }}/be_{{ service_name }}"
  tag: "{{ env }}-{{ git_commit | default('latest') }}"
  container_name: "be-{{ service_name }}"
  port: "{{ app_ports.backend }}"
  ai_service_base_url: "http://{{ internal_ips.ai }}:{{ app_ports.ai }}"

  # OAuth 설정 (운영 환경)
  oauth:
    kakao:
      client_id: "{{ vault_kakao_client_id }}"
      redirect_uri: "https://{{ nginx.domain }}/kakao/callback"
      complete_redirect_uri: "https://{{ nginx.domain }}/kakao/callback/complete"

  # JVM 설정 (운영 환경 최적화)
  jvm:
    heap_size: "4g" # 운영환경 더 큰 힙 크기
    gc_type: "G1GC" # G1 가비지 컬렉터
    additional_opts: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError"

  # APM 설정
  apm:
    service_name: "backend-moongsan"
    server_urls: "http://34.47.84.135:8200"
    environment: "{{ env }}"
    log_level: "INFO"
    capture_body: "errors"
    capture_headers: "true"

# Docker 네트워크 설정
docker:
  network_name: "moongsan-net"
  network_driver: bridge
  network_subnet: "172.21.0.0/16"

# AI 서비스 설정 (운영 환경)
ai:
  image: "{{ dockerhub.username }}/ai_{{ service_name }}"
  tag: "{{ env }}-{{ git_commit | default('latest') }}"
  container_name: "ai-{{ service_name }}"
  port: "{{ app_ports.ai }}"
  openai_api_key: "{{ vault_openai_api_key }}"

  # Tavily API 키들
  tavily_api_keys: "{{ vault_tavily_api_keys }}"

  # LangSmith 설정
  langsmith:
    tracing: true
    endpoint: https://api.smith.langchain.com
    api_key: "{{ vault_langsmith_api_key }}"
    project: "Generate_Description_{{ env }}"

  # Langfuse 설정 (추가)
  langfuse:
    host: https://us.cloud.langfuse.com/
    public_key: "{{ vault_langfuse_public_key }}"
    secret_key: "{{ vault_langfuse_secret_key }}"

  # APM 설정
  apm:
    service_name: "ai-moongsan"
    server_url: "http://34.47.84.135:8200"
    environment: "{{ env }}"
    capture_body: "errors"
    capture_headers: "true"

  # 프록시 설정
  proxies: "{{ vault_proxies }}"

  # 백엔드 URL 설정
  backend_url: "http://{{ internal_ips.backend }}:{{ app_ports.backend }}/"

  # Python 환경 설정
  python:
    version: "3.11"
    requirements_file: "requirements.txt"

# WireGuard VPN 설정 (shared-jumpbox 연결용) - 운영 환경
wireguard:
  server_endpoint: "{{ wireguard_server_ip }}:51820"
  server_public_key: "+VE4Cr4Wz9UJRVOYS3CWEpuXo8o9bF3phl/clzKjNHM="
  allowed_ips:
    - "10.8.0.0/24" # WireGuard VPN 네트워크
    - "10.1.0.0/16" # prod 환경 VPC
    - "172.16.0.0/16" # shared 환경 VPC
  dns: "8.8.8.8, 8.8.4.4"
  environment: "prod"
  description: "운영 환경에서 shared-jumpbox VPN 서버로 연결"

# AWS 설정 (운영 환경)
aws:
  iam:
    access_key: "{{ vault_aws_access_key }}"
    secret_key: "{{ vault_aws_secret_key }}"
  s3:
    region: ap-northeast-2
    bucket: "{{ service_name }}-s3" # prod 환경용 S3 버킷
    base_url: "https://{{ service_name }}-s3.s3.ap-northeast-2.amazonaws.com/"

# GCP 설정 (운영 환경)
gcp:
  # GCP 인증 정보 (JSON 내용을 변수로 분리)
  credentials:
    type: "service_account"
    project_id: "ktb-2-moongsan"
    private_key_id: "{{ vault_gcp_private_key_id }}"
    private_key: "{{ vault_gcp_private_key }}"
    client_email: "terraform-admin@ktb-2-moongsan.iam.gserviceaccount.com"
    client_id: "115795500518818995253"
    auth_uri: "https://accounts.google.com/o/oauth2/auth"
    token_uri: "https://oauth2.googleapis.com/token"
    auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs"
    client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/terraform-admin%40ktb-2-moongsan.iam.gserviceaccount.com"
    universe_domain: "googleapis.com"

  # GCS (Google Cloud Storage) 설정
  gcs:
    # Frontend 배포용 설정 (Terraform에서 이미 구축된 인프라)
    fe:
      bucket_name: "moongsan-prod-frontend" # Terraform output과 일치
      project: "ktb-2-moongsan" # GCP 프로젝트 ID
      cdn_ip: "34.8.174.93" # prod Load Balancer IP
      domain: "{{ nginx.domain }}" # Terraform에서 설정된 도메인

    # Database 백업용 설정
    backup:
      name: "{{ service_name }}-backup"
      project: "ktb-2-moongsan"
      private_key_id: "{{ vault_gcp_backup_private_key_id }}"
      private_key: "{{ vault_gcp_backup_private_key }}"
      client_email: "moongsan-sa@ktb-2-moongsan.iam.gserviceaccount.com"
      client_id: "114570438821910428197"
      client_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/moongsan-sa%40ktb-2-moongsan.iam.gserviceaccount.com"

  # AI 서비스용 GCP 설정
  ai:
    credentials: deft-observer-456807-c5-e9dda0532301.json
    project: deft-observer-456807-c5
    location: us-central1
    private_key_id: "{{ vault_gcp_ai_private_key_id }}"
    private_key: "{{ vault_gcp_ai_private_key }}"
    client_email: vertex-gemini-api@deft-observer-456807-c5.iam.gserviceaccount.com
    client_id: "116266968708421115648"
    client_cert_url: https://www.googleapis.com/robot/v1/metadata/x509/vertex-gemini-api%40deft-observer-456807-c5.iam.gserviceaccount.com

# SSL/TLS 설정 (운영 환경 보안 강화)
ssl:
  certificate_email: "nangmannsh@gmail.com"
  renewal_days: 30 # 30일 전 갱신
  key_size: 4096 # 더 큰 키 크기
  protocols: "TLSv1.2 TLSv1.3" # 최신 TLS 프로토콜만 허용

# 로깅 설정 (운영 환경 강화)
logging:
  level: "INFO" # 운영환경 로그 레벨
  retention_days: 30 # 로그 보관 기간
  max_size: "100M" # 로그 파일 최대 크기
  backup_count: 7 # 백업 파일 개수

# 모니터링 설정 (운영 환경)
monitoring:
  health_check_interval: 30 # 헬스체크 간격 (초)
  metrics_enabled: true # 메트릭 수집 활성화
  alerts_enabled: true # 알림 활성화

# 백업 설정 (운영 환경)
backup:
  enabled: true
  schedule: "0 2 * * *" # 매일 새벽 2시 백업
  retention_days: 7 # 백업 보관 기간
  database_backup: true
  config_backup: true

# 보안 설정 (운영 환경 강화)
security:
  fail2ban_enabled: true # fail2ban 활성화
  ufw_enabled: true # UFW 방화벽 활성화
  ssh_key_only: true # SSH 키 인증만 허용
  disable_password_auth: true # 패스워드 인증 비활성화

# 운영 환경 특화 설정
production:
  debug: false # 디버그 모드 비활성화
  cors_allowed_origins: # CORS 허용 도메인 제한
    - "https://{{ nginx.domain }}"
    - "https://www.{{ nginx.domain }}"
  rate_limiting: true # Rate limiting 활성화

# CDN 설정 (운영 환경)
cdn:
  enabled: true
  cache_ttl: 86400 # 24시간 캐시
  gzip_enabled: true # Gzip 압축 활성화
