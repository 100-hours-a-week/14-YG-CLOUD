# ========================================
# Development Environment Inventory
# 단일 서버 구조 - 모든 서비스가 하나의 서버에서 실행
# ========================================

[dev]
dev.moongsan.com ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/lsh-study-key

# 그룹 별칭 (dev 환경에서는 모든 서비스가 같은 서버에서 실행)
[internal_servers:children]
dev

[database:children]
dev

[backend:children]
dev

[ai:children]
dev

[jumpbox:children]
dev

# 전역 변수 설정
[all:vars]
env=dev
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
service_name=moongsan
ansible_python_interpreter=/usr/bin/python3

# Dev 환경 특정 변수
[dev:vars]
# 단일 서버 모드
single_server_mode=true
docker_network_mode=bridge
