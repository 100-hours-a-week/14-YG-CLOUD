# WireGuard VPN 배포 통합 플레이북
# 사용법: ansible-playbook -i inventory.ini wireguard_playbook.yml -e "wireguard_target=backend"

- import_playbook: playbooks/wireguard_deploy.yml
  vars:
    target: "{{ wireguard_target | default('backend') }}"

- name: WireGuard 배포 후 검증
  hosts: "{{ wireguard_target | default('backend') }}"
  become: yes
  tasks:
    - name: WireGuard 서비스 상태 확인
      systemd:
        name: wg-quick@wg0
      register: wg_service_status

    - name: WireGuard 인터페이스 상태 확인
      shell: ip addr show wg0
      register: wg_interface_status
      failed_when: false

    - name: 연결된 피어 확인
      shell: wg show wg0 peers
      register: wg_peers
      failed_when: false

    - name: 배포 결과 요약
      debug:
        msg:
          - "✅ WireGuard 서비스: {{ wg_service_status.status.ActiveState }}"
          - "✅ WireGuard 인터페이스: {{ 'UP' if wg_interface_status.rc == 0 else 'DOWN' }}"
          - "✅ 연결된 피어 수: {{ wg_peers.stdout_lines | length if wg_peers.rc == 0 else 0 }}"

    - name: 연결된 피어 목록
      debug:
        var: wg_peers.stdout_lines
      when: wg_peers.rc == 0 and wg_peers.stdout_lines | length > 0
