# 깃허브 repo에서 be를 clone
- name: Force update betest backend repository
  shell: |
    if [ -d /home/ubuntu/14-YG-BE ]; then
      cd /home/ubuntu/14-YG-BE && git fetch origin && git checkout -B main origin/main
    else
      git clone -b main https://github.com/100-hours-a-week/14-YG-BE.git /home/ubuntu/14-YG-BE
    fi
  args:
    executable: /bin/bash

# betest 레포의 소유권을 ubuntu로 변경
- name: Mark betest repo as safe for git
  shell: git config --global --add safe.directory /home/ubuntu/14-YG-BE
  become: false
  args:
    executable: /bin/bash

# --- docker로 전환
- name: Ensure envs directory for backend exists
  file:
    path: "/home/ubuntu/envs/{{ group_names[0] }}"
    state: directory
    mode: "0755"
    owner: ubuntu
    group: ubuntu

# 환경 변수 파일 생성
- name: Generate .env.prod file from template
  template:
    src: env.prod.j2
    dest: "/home/ubuntu/envs/{{ group_names[0] }}/backend.env.prod"
    mode: "0644"
    owner: ubuntu
    group: ubuntu

- name: Ensure CORS allows dev/test domains
  lineinfile:
    path: /home/ubuntu/14-YG-BE/src/main/java/com/moogsan/moongsan_backend/global/config/SecurityConfig.java
    insertafter: '^\s*config\.setAllowedOrigins\(List\.of\($'
    line: '                "https://{{ nginx.domain }}",'
    state: present
  become: true

# build 전 캐시/이미지 정리
- name: Prune unused Docker images (dangling only)
  shell: docker image prune -f
  become: true

- name: Prune Docker builder cache
  shell: docker builder prune -f
  become: true

- name: Ensure Docker network moongsan-net exists
  community.docker.docker_network:
    name: moongsan-net
    state: present
  become: true

# --- <운영으로 전환시 삭제>
- name: Copy Dockerfile to BE repo for build
  copy:
    src: /home/ubuntu/14-YG-CLOUD/docker/backend/Dockerfile
    dest: /home/ubuntu/14-YG-BE/Dockerfile
    remote_src: true
  become: true

- name: Build Docker image for backend
  shell: >
    docker build -t {{ be.image }}:{{ be.tag }}
    -f Dockerfile .
  args:
    chdir: /home/ubuntu/14-YG-BE
  become: true

- name: DockerHub 로그인
  shell: echo "{{ dockerhub.password }}" | docker login --username {{ dockerhub.username }} --password-stdin
  become: true

- name: Push Docker image to registry
  shell: docker push {{ be.image }}:{{ be.tag }}
  become: true
# --- </운영으로 전환시 삭제>

- name: Pull image from registry (post-push validation)
  shell: docker pull {{ be.image }}:{{ be.tag }}
  become: true

- name: Ensure backend container is absent before redeployment
  community.docker.docker_container:
    name: "{{ be.container_name }}"
    state: absent

- name: Ensure logs directory exists
  file:
    path: "{{ path.log }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Run backend container
  community.docker.docker_container:
    name: "{{ be.container_name }}"
    image: "{{ be.image }}:{{ be.tag }}"
    state: started
    recreate: true # always recreate for fresh image
    restart_policy: unless-stopped
    env_file: "/home/ubuntu/envs/test/backend.env.prod"
    published_ports:
      - "{{ be.port }}:8080"
    volumes:
      - "{{ path.log }}:{{ path.log }}"
    networks:
      - name: moongsan-net

- name: Remove dangling images after deployment
  shell: docker image prune -f
  become: true

# logrotate 설정
- name: Ensure logrotate config for betest backend exists
  copy:
    dest: /etc/logrotate.d/be_moongsan
    content: |
      {{ path.log }}/logs/be_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
  become: true
