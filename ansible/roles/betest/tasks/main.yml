- name: Ensure logrotate config for betest backend exists
  copy:
    dest: /etc/logrotate.d/be_moongsan
    content: |
      /home/ubuntu/logs/be_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
  become: true
