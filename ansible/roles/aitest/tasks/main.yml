# 환경 변수 + GCP 서비스 계정 키 파일을 템플릿에서 생성
- name: Generate .env file from template
  template:
    src: .env.j2
    dest: /home/ubuntu/14-YG-AI/.env
    mode: "0644"

- name: Generate GCP service account key file from template
  template:
    src: service-account.json.j2
    dest: /home/ubuntu/14-YG-AI/deft-observer-456807-c5-e9dda0532301.json
    mode: "0600"

- name: Copy Dockerfile to AI repo
  copy:
    src: /home/ubuntu/14-YG-CLOUD/docker/ai/Dockerfile
    dest: /home/ubuntu/14-YG-AI/Dockerfile
    remote_src: true
  become: true

# Docker build
- name: Build Docker image for AI
  shell: >
    docker build -t {{ ai.image }}:{{ ai.tag }}
    -f Dockerfile .
  args:
    chdir: /home/ubuntu/14-YG-AI
  become: true

# DockerHub 로그인
- name: DockerHub 로그인
  shell: echo "{{ dockerhub.password }}" | docker login --username {{ dockerhub.username }} --password-stdin
  become: true

# Docker 이미지 푸시
- name: Push Docker image to registry
  shell: docker push {{ ai.image }}:{{ ai.tag }}
  become: true

# Docker 이미지 풀 (푸시 후 검증)
- name: Pull AI image from registry
  shell: docker pull {{ ai.image }}:{{ ai.tag }}
  become: true

# Docker run
- name: Run AI container
  community.docker.docker_container:
    name: "{{ ai.container_name }}"
    image: "{{ ai.image }}:{{ ai.tag }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    env_file: "/home/ubuntu/14-YG-AI/.env"
    published_ports:
      - "{{ ai.port }}:8100"
    volumes:
      - "{{ log_path }}:{{ log_path }}"

