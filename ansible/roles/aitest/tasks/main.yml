- name: Clone AI repo if not present
  git:
    repo: https://github.com/100-hours-a-week/14-YG-AI.git
    dest: /home/ubuntu/14-YG-AI
    version: main
    update: yes
    force: no
    accept_hostkey: yes
  when: not (ansible_facts['discovered_interpreter_python'] is search('/home/ubuntu/14-YG-AI'))

