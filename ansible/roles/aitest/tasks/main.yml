- name: Check if AI repo already exists
  stat:
    path: /home/ubuntu/14-YG-AI
  register: ai_repo_stat

- name: Clone AI repo if not present
  git:
    repo: https://github.com/100-hours-a-week/14-YG-AI.git
    dest: /home/ubuntu/14-YG-AI
    version: release/v1.0.0
    update: yes
    force: no
    accept_hostkey: yes
  when: not ai_repo_stat.stat.exists

# ansible/roles/aitest/tasks/patch_requirements.yml
# --- requirements.txt 수정 이유 ---
# AI 서비스가 정상적으로 실행되기 위해 일부 필수 라이브러리 버전 고정이 필요함.
# 1. PyYAML: langgraph 프레임워크에서 내부적으로 사용하는 YAML 파싱 의존성
# 2. torch==2.3.0: easyocr에서 사용하는 딥러닝 백엔드와의 호환성을 위해 필요
# 3. opencv-python-headless==4.9.0.80: easyocr와의 충돌 방지 및 안정적인 이미지 처리용
# 4. pytest-mock==3.14.0: 테스트 환경에서 버전 미정으로 인한 충돌 방지를 위해 고정
# 해당 수정은 테스트 및 운영환경 일관성 유지를 위한 임시 조치이며, 추후 레포 자체 수정 예정
- name: Ensure PyYAML is present with version
  lineinfile:
    path: /home/ubuntu/14-YG-AI/v1/requirements.txt
    regexp: "^PyYAML"
    line: "PyYAML>=6.0"
    insertafter: EOF
    create: yes

- name: Ensure torch==2.3.0 is present
  lineinfile:
    path: /home/ubuntu/14-YG-AI/v1/requirements.txt
    regexp: "^torch"
    line: "torch==2.3.0"
    insertafter: EOF

- name: Ensure opencv-python-headless==4.9.0.80 is present
  lineinfile:
    path: /home/ubuntu/14-YG-AI/v1/requirements.txt
    regexp: "^opencv-python-headless"
    line: "opencv-python-headless==4.9.0.80"
    insertafter: EOF

- name: Set pytest-mock to specific version
  lineinfile:
    path: /home/ubuntu/14-YG-AI/v1/requirements.txt
    regexp: "^pytest-mock"
    line: "pytest-mock==3.14.0"

- name: Ensure uvicorn is present
  lineinfile:
    path: /home/ubuntu/14-YG-AI/v1/requirements.txt
    regexp: "^uvicorn"
    line: "uvicorn[standard]"
    insertafter: EOF

