- name: Remove dangling images after deployment
  shell: docker image prune -f
  become: true

- name: Ensure ai log file is readable
  file:
    path: "{{ path.log }}/ai_moongsan.log"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Ensure logrotate config for aitest ai exists
  copy:
    dest: /etc/logrotate.d/ai_moongsan
    content: |
      {{ path.log }}/ai_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
  become: true
