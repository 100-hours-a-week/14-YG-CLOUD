# 환경 변수 + GCP 서비스 계정 키 파일을 템플릿에서 생성
- name: Generate .env file from template
  template:
    src: .env.j2
    dest: /home/ubuntu/14-YG-AI/v1/.env
    mode: "0644"

- name: Generate GCP service account key file from template
  template:
    src: service-account.json.j2
    dest: /home/ubuntu/14-YG-AI/v1/deft-observer-456807-c5-e9dda0532301.json
    mode: "0600"

- name: Copy Dockerfile to AI repo
  copy:
    src: /home/ubuntu/14-YG-CLOUD/docker/ai/Dockerfile
    dest: /home/ubuntu/14-YG-AI/v1/Dockerfile
    remote_src: true
  become: true

# uvicorn이 pip --user 경로인 /root/.local/bin에 설치되었기 때문에,
# bash 실행 시 해당 경로가 PATH에 반영되지 않아 uvicorn 명령어를 인식하지 못함.
# 따라서 ENTRYPOINT에서 uvicorn의 전체 경로(/root/.local/bin/uvicorn)를 명시적으로 사용함.
# 이 수정은 Docker 컨테이너의 환경 일관성 확보를 위한 임시 조치이며,
# 추후 시스템 전체에 설치(pip install -r requirements.txt without --user)하는 방식으로 전환 가능.

# build 전 캐시/이미지 정리
- name: Prune unused Docker images (dangling only)
  shell: docker image prune -f
  become: true

- name: Prune Docker builder cache
  shell: docker builder prune -f
  become: true

- name: Ensure Docker network moongsan-net exists
  community.docker.docker_network:
    name: moongsan-net
    state: present
  become: true

# Docker build
- name: Build Docker image for AI
  shell: >
    docker build -t {{ ai.image }}:{{ ai.tag }}
    -f Dockerfile .
  args:
    chdir: /home/ubuntu/14-YG-AI/v1
  become: true

# DockerHub 로그인
- name: DockerHub 로그인
  shell: echo "{{ dockerhub.password }}" | docker login --username {{ dockerhub.username }} --password-stdin
  become: true

# Docker 이미지 푸시
- name: Push Docker image to registry
  shell: docker push {{ ai.image }}:{{ ai.tag }}
  become: true

# Docker 이미지 풀 (푸시 후 검증)
- name: Pull AI image from registry
  shell: docker pull {{ ai.image }}:{{ ai.tag }}
  become: true

# Docker run
- name: Run AI container
  community.docker.docker_container:
    name: "{{ ai.container_name }}"
    image: "{{ ai.image }}:{{ ai.tag }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    env_file: "/home/ubuntu/14-YG-AI/v1/.env"
    published_ports:
      - "{{ ai.port }}:8100"
    volumes:
      - "{{ path.log }}:{{ path.log }}"
    networks:
      - name: moongsan-net

