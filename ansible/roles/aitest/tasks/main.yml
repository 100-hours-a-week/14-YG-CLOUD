- name: Ensure ai log file is readable
  file:
    path: "{{ log_path }}/ai_moongsan.log"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Ensure logrotate config for aitest ai exists
  copy:
    dest: /etc/logrotate.d/ai_moongsan
    content: |
      {{ log_path }}/ai_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
  become: true
