---
# Base system setup role for all VMs

- name: Update system packages
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600
  become: yes

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - unzip
      - python3
      - python3-pip
      - python3-venv
      - build-essential
    state: present
  become: yes

- name: Configure timezone
  timezone:
    name: Asia/Seoul
  become: yes

- name: Create application directory
  file:
    path: "/var/{{ service_name }}"
    state: directory
    mode: "0755"
  become: yes

- name: Create log directory
  file:
    path: "{{ path.log }}"
    state: directory
    mode: "0755"
  become: yes

- name: Create backup directory
  file:
    path: "{{ path.backup }}"
    state: directory
    mode: "0755"
  become: yes

- name: Create script directory
  file:
    path: "{{ path.script }}"
    state: directory
    mode: "0755"
  become: yes

- name: Set up logrotate for application logs
  template:
    src: logrotate.conf.j2
    dest: "/etc/logrotate.d/{{ service_name }}"
    mode: "0644"
  become: yes

- name: Configure sysctl for performance
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  become: yes
  loop:
    - {name: "vm.swappiness", value: "10"}
    - {name: "net.core.rmem_max", value: "134217728"}
    - {name: "net.core.wmem_max", value: "134217728"}
    - {name: "net.ipv4.tcp_rmem", value: "4096 65536 134217728"}
    - {name: "net.ipv4.tcp_wmem", value: "4096 65536 134217728"}

- name: Install Docker
  apt:
    name: docker.io
    state: present
  become: yes

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: yes

- name: Install Docker Compose
  pip:
    name: docker-compose
    state: present
  become: yes
