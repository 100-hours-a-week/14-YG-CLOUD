# Base system setup role for 3-tier architecture

- name: Check if Docker is already installed
  command: docker --version
  register: docker_check
  ignore_errors: yes
  when: "'backend' in group_names or 'ai' in group_names or 'database' in group_names"

- name: Update system packages
  apt:
    update_cache: yes
    upgrade: dist
    cache_valid_time: 3600
  become: yes

- name: Install common essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - unzip
    state: present
  become: yes

- name: Install Python packages for backend and AI servers
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - build-essential
    state: present
  become: yes
  when: "'backend' in group_names or 'ai' in group_names"

- name: Configure timezone
  timezone:
    name: Asia/Seoul
  become: yes

- name: Create application directory
  file:
    path: "/var/{{ service_name }}"
    state: directory
    mode: "0755"
  become: yes

- name: Create log directory
  file:
    path: "{{ paths.log }}"
    state: directory
    mode: "0755"
  become: yes
  when: paths is defined and paths.log is defined

- name: Create backup directory
  file:
    path: "{{ paths.backup }}"
    state: directory
    mode: "0755"
  become: yes
  when: paths is defined and paths.backup is defined

- name: Create script directory
  file:
    path: "{{ paths.script }}"
    state: directory
    mode: "0755"
  become: yes
  when: paths is defined and paths.script is defined

- name: Set up logrotate for application logs
  template:
    src: logrotate.conf.j2
    dest: "/etc/logrotate.d/{{ service_name }}"
    mode: "0644"
  become: yes

- name: Configure sysctl for performance
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  become: yes
  loop:
    - {name: "vm.swappiness", value: "10"}
    - {name: "net.core.rmem_max", value: "134217728"}
    - {name: "net.core.wmem_max", value: "134217728"}
    - {name: "net.ipv4.tcp_rmem", value: "4096 65536 134217728"}
    - {name: "net.ipv4.tcp_wmem", value: "4096 65536 134217728"}

- name: Install Docker for backend, AI and database servers
  apt:
    name: docker.io
    state: present
  become: yes
  when:
    - "'backend' in group_names or 'ai' in group_names or 'database' in group_names"
    - docker_check is defined
    - docker_check.rc != 0

- name: Start and enable Docker for backend, AI and database servers
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes
  when: "'backend' in group_names or 'ai' in group_names or 'database' in group_names"

- name: Add ubuntu user to docker group for backend, AI and database servers
  user:
    name: "{{ system.user }}"
    groups: docker
    append: yes
  become: yes
  when: "'backend' in group_names or 'ai' in group_names or 'database' in group_names"

- name: Install Docker Compose for backend server only
  pip:
    name: docker-compose
    state: present
  become: yes
  when: "'backend' in group_names"
