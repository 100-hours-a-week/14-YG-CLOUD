- name: Clone frontend repository (clean)
  git:
    repo: https://github.com/100-hours-a-week/14-YG-FE
    dest: /home/ubuntu/14-YG-FE
    version: main
    force: yes # <- update 대신 강제 덮어쓰기. git pull 충돌 방지

- name: Ensure 14-YG-FE directory ownership is ubuntu:ubuntu
  file:
    path: /home/ubuntu/14-YG-FE
    recurse: yes
    state: directory
    owner: ubuntu
    group: ubuntu
  become: true

# 0. Dockerfile 복사
- name: Copy Dockerfile to FE repo
  copy:
    src: /home/ubuntu/14-YG-CLOUD/docker/frontend/Dockerfile
    dest: /home/ubuntu/14-YG-FE/Dockerfile
    remote_src: true

# 1. Docker 빌드
- name: Build frontend Docker image
  shell: >
    docker build -t {{ fe.image }}:{{ fe.tag }}
    -f Dockerfile .
  args:
    chdir: /home/ubuntu/14-YG-FE
  become: true

# 2. DockerHub 로그인
- name: DockerHub 로그인
  shell: echo "{{ dockerhub.password }}" | docker login --username {{ dockerhub.username }} --password-stdin
  become: true

# 3. Docker push
- name: Push frontend Docker image to registry
  shell: docker push {{ fe.image }}:{{ fe.tag }}
  become: true

# 4. Docker pull (검증용)
- name: Pull image for validation
  shell: docker pull {{ fe.image }}:{{ fe.tag }}
  become: true

# 5. 기존 컨테이너 제거
- name: Ensure frontend container is absent before redeployment
  community.docker.docker_container:
    name: "{{ fe.container_name }}"
    state: absent

# 6. 컨테이너 실행
- name: Run frontend container
  community.docker.docker_container:
    name: "{{ fe.container_name }}"
    image: "{{ fe.image }}:{{ fe.tag }}"
    state: started
    recreate: true
    restart_policy: unless-stopped
    published_ports:
      - "{{ fe.port }}:80"
    volumes:
      - "{{ log_path }}:{{ log_path }}"

# 7. 불필요 이미지 정리
- name: Remove dangling images
  shell: docker image prune -f
  become: true

