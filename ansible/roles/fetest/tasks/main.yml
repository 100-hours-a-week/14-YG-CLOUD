- name: Ensure logrotate config for frontend exists
  copy:
    dest: /etc/logrotate.d/frontend
    content: |
      /home/ubuntu/logs/fe_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
  become: true
