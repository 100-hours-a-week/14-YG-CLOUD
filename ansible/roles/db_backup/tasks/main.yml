- name: Install Google Cloud SDK
  apt:
    name: ["apt-transport-https", "ca-certificates", "gnupg"]
    state: present
    update_cache: yes

- name: Add missing GPG key for Google Cloud SDK repository
  apt_key:
    keyserver: keyserver.ubuntu.com
    id: C0BA5CE6DC6315A3
    state: present

- name: Download and add Google Cloud SDK GPG key
  command: bash -c "curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg | apt-key add -"

- name: Add Google Cloud SDK apt repository securely
  apt_repository:
    repo: "deb https://packages.cloud.google.com/apt cloud-sdk main"
    filename: "google-cloud-sdk"
    state: present

- name: Install google-cloud-sdk
  apt:
    name: google-cloud-sdk
    state: present
    update_cache: yes
  become: yes

- name: Ensure DB backup and logs directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ path.backup }}"
    - "{{ path.log }}"
    - "{{ path.script }}"
    - "{{ path.secret }}"

- name: Deploy DB backup script from template
  template:
    src: db_backup.sh.j2
    dest: "{{ path.script }}/db_backup.sh"
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Deploy GCP service account key template
  template:
    src: gcs-key.json.j2
    dest: "{{ path.secret }}/my-gcs-key.json"
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Schedule daily cronjob for DB backup
  cron:
    name: "Daily DB backup to GCS"
    user: root
    job: 'PATH=/snap/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin GOOGLE_APPLICATION_CREDENTIALS="{{ path.secret }}/my-gcs-key.json" {{ path.script }}/db_backup.sh >> {{ path.log }}/db_backup.log 2>&1'
    hour: "03"

- name: Configure logrotate for DB backup log
  copy:
    dest: /etc/logrotate.d/db_backup
    content: |
      {{ path.log }}/db_backup.log {
          daily
          rotate 7
          compress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
    owner: root
    group: root
    mode: "0644"
