- name: Clone frontend repository (clean)
  git:
    repo: https://github.com/100-hours-a-week/14-YG-FE
    dest: /home/ubuntu/14-YG-FE
    version: "{{ branch }}"
    force: yes # <- update 대신 강제 덮어쓰기. git pull 충돌 방지

- name: Ensure 14-YG-FE directory ownership is ubuntu:ubuntu
  file:
    path: /home/ubuntu/14-YG-FE
    recurse: yes
    state: directory
    owner: ubuntu
    group: ubuntu
  become: true

# - name: Generate vite.config.ts from template
#   template:
#     src: vite.config.ts.j2
#     dest: /home/ubuntu/14-YG-FE/vite.config.ts
#     mode: "0644"
#   become: true

- name: Generate .env file for Vite
  template:
    src: vite.env.j2
    dest: /home/ubuntu/14-YG-FE/.env.prod
    mode: "0644"
  become: true

- name: Install frontend dependencies
  npm:
    path: /home/ubuntu/14-YG-FE
    state: present
  become: false

- name: Build frontend project
  shell: npm run build
  args:
    chdir: /home/ubuntu/14-YG-FE
  register: fe_build_result
  failed_when: fe_build_result.rc != 0
  become: false

- name: Write build log manually
  copy:
    dest: "{{ path.log }}/fe_moongsan.log"
    content: |
      ===== STDOUT =====
      {{ fe_build_result.stdout }}
      ===== STDERR =====
      {{ fe_build_result.stderr }}
  become: true

- name: Deploy built frontend to nginx
  shell: rsync -av --delete /home/ubuntu/14-YG-FE/dist/ {{ path.nginx }}/
  become: true

- name: Health check for React frontend (via localhost)
  uri:
    url: "https://{{ nginx.domain }}"
    return_content: yes
    validate_certs: no
  register: frontend_health
  failed_when: '''<div id="root">'' not in frontend_health.content'
  changed_when: false

- name: Ensure logrotate config for frontend exists
  copy:
    dest: /etc/logrotate.d/frontend
    content: |
      {{ path.log }}/fe_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
  become: true
