# Frontend GCS+CDN 배포 Role (방법 1: 배포만 담당)
# Terraform에서 이미 구축된 GCS+CDN 인프라에 React 빌드 파일 배포

- name: Install required packages for frontend deployment
  apt:
    name:
      - curl
      - unzip
      - git
      - build-essential
    state: present
    update_cache: yes
  become: true

- name: Install Node.js 18.x (LTS)
  block:
    - name: Check if Node.js is already installed
      command: node --version
      register: node_check
      ignore_errors: yes
      
    - name: Add NodeSource repository for Node.js 18.x
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
      become: true
      when: node_check.rc != 0 or not node_check.stdout.startswith('v18')
      
    - name: Install Node.js and npm
      apt:
        name:
          - nodejs
        state: present
        update_cache: yes
      become: true
      when: node_check.rc != 0 or not node_check.stdout.startswith('v18')

- name: Install Google Cloud SDK
  block:
    - name: Check if gcloud is already installed
      command: which gcloud
      register: gcloud_check
      ignore_errors: yes
      
    - name: Add Google Cloud SDK repository
      shell: |
        echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
        curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
        sudo apt-get update
      become: true
      when: gcloud_check.rc != 0
      
    - name: Install Google Cloud CLI
      apt:
        name: google-cloud-cli
        state: present
        update_cache: yes
      become: true
      when: gcloud_check.rc != 0

- name: Clone frontend repository
  block:
    - name: Configure git safe directory
      git_config:
        name: safe.directory
        value: "{{ project_paths.fe_repo }}"
        scope: global
      become: false
      
    - name: Clone frontend repository
      git:
        repo: "{{ project_repos.fe_url }}"
        dest: "{{ project_paths.fe_repo }}"
        version: "{{ branch }}"
        force: yes
      become: false

- name: Ensure required directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ paths.secret }}"
    - "{{ paths.log }}"
    - "{{ project_paths.fe_repo }}"

- name: Ensure frontend directory ownership
  file:
    path: "{{ project_paths.fe_repo }}"
    recurse: yes
    state: directory
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
  become: true

- name: Generate .env.production file for React
  template:
    src: react.env.j2
    dest: "{{ project_paths.fe_repo }}/{{ fe.build.env_file }}"
    mode: "0644"
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
  become: true
  when: fe.build.env_file is defined

- name: Install frontend dependencies
  npm:
    path: "{{ project_paths.fe_repo }}"
    state: present
  become: false

- name: Build frontend project
  shell: "{{ fe.build.build_command }}"
  args:
    chdir: "{{ project_paths.fe_repo }}"
  register: fe_build_result
  failed_when: fe_build_result.rc != 0
  become: false

- name: Write build log
  copy:
    dest: "{{ paths.log }}/fe_gcs_deploy.log"
    content: |
      ===== Frontend Build Log =====
      Build Time: {{ ansible_date_time.iso8601 }}
      Command: {{ fe.build.build_command }}
      
      ===== STDOUT =====
      {{ fe_build_result.stdout }}
      
      ===== STDERR =====
      {{ fe_build_result.stderr }}
    mode: "0644"
  become: true

- name: Generate GCS service account key file
  template:
    src: gcs-service-account.json.j2
    dest: "{{ paths.secret }}/gcs-frontend-sa.json"
    mode: "0644"
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
  become: true

- name: Authenticate with Google Cloud using service account
  shell: |
    # 서비스 계정 파일 경로
    SA_FILE="{{ paths.secret }}/gcs-frontend-sa.json"
    echo "서비스 계정 파일 확인: $SA_FILE"
    ls -la "$SA_FILE"
    
    # 환경변수로 먼저 설정
    export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
    
    # 기존 gcloud 설정 초기화
    gcloud auth revoke --all 2>/dev/null || true
    gcloud config configurations create frontend-deploy 2>/dev/null || true
    gcloud config configurations activate frontend-deploy
    
    # 새로운 서비스 계정으로 인증 (정확한 서비스 계정 이메일 사용)
    gcloud auth activate-service-account terraform-admin@ktb-2-moongsan.iam.gserviceaccount.com \
      --key-file="$SA_FILE"
    
    # 프로젝트 설정
    gcloud config set project ktb-2-moongsan
    
    # 인증 상태 확인
    echo "=== 인증 상태 확인 ==="
    gcloud auth list --filter=status:ACTIVE --format="value(account)"
    echo "=== 프로젝트 확인 ==="
    gcloud config get-value project
    echo "=== Application Default Credentials 설정 ==="
    gcloud auth application-default print-access-token 2>/dev/null | cut -c1-20 || echo "ADC 설정 실패"
  become: false
  register: auth_result
  failed_when: auth_result.rc != 0

- name: Test GCS access with service account
  shell: |
    # 환경변수 설정
    export GOOGLE_APPLICATION_CREDENTIALS="{{ paths.secret }}/gcs-frontend-sa.json"
    
    # 현재 활성 계정 확인
    ACTIVE_ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format="value(account)")
    echo "현재 활성 계정: $ACTIVE_ACCOUNT"
    echo "예상 계정: terraform-admin@ktb-2-moongsan.iam.gserviceaccount.com"
    
    # GCS 버킷 접근 테스트 (여러 방법 시도)
    echo "=== GCS 접근 테스트 ==="
    
    # 방법 1: gcloud storage (새 명령)
    echo "1. gcloud storage로 버킷 목록 확인..."
    if gcloud storage ls "gs://{{ gcp.gcs.fe.bucket_name }}/" --limit=1 2>/dev/null; then
      echo "✅ gcloud storage 접근 성공"
      ACCESS_METHOD="gcloud_storage"
    else
      echo "❌ gcloud storage 접근 실패"
      ACCESS_METHOD=""
    fi
    
    # 방법 2: gsutil (기존 명령)
    if [ -z "$ACCESS_METHOD" ]; then
      echo "2. gsutil로 버킷 목록 확인..."
      if gsutil ls "gs://{{ gcp.gcs.fe.bucket_name }}/" 2>/dev/null; then
        echo "✅ gsutil 접근 성공"
        ACCESS_METHOD="gsutil"
      else
        echo "❌ gsutil 접근 실패"
      fi
    fi
    
    # 방법 3: curl로 REST API 직접 호출
    if [ -z "$ACCESS_METHOD" ]; then
      echo "3. REST API로 직접 접근..."
      TOKEN=$(gcloud auth application-default print-access-token 2>/dev/null || gcloud auth print-access-token 2>/dev/null)
      if [ -n "$TOKEN" ]; then
        if curl -s -H "Authorization: Bearer $TOKEN" \
          "https://storage.googleapis.com/storage/v1/b/{{ gcp.gcs.fe.bucket_name }}/o?maxResults=1" >/dev/null; then
          echo "✅ REST API 접근 성공"
          ACCESS_METHOD="rest_api"
        else
          echo "❌ REST API 접근 실패"
        fi
      else
        echo "❌ 토큰 생성 실패"
      fi
    fi
    
    echo "=== 접근 가능한 방법: ${ACCESS_METHOD:-'없음'} ==="
    
    # 하나라도 성공하면 통과
    if [ -n "$ACCESS_METHOD" ]; then
      exit 0
    else
      echo "❌ 모든 GCS 접근 방법 실패"
      exit 1
    fi
  become: false
  register: gcs_test
  failed_when: false  # 실패해도 계속 진행

- name: Display GCS access test results
  debug:
    msg: "{{ gcs_test.stdout_lines }}"

- name: Upload built files to GCS bucket
  shell: |
    # 환경변수 설정
    export GOOGLE_APPLICATION_CREDENTIALS="{{ paths.secret }}/gcs-frontend-sa.json"
    
    # 빌드 파일이 존재하는지 확인
    BUILD_DIR="{{ project_paths.fe_repo }}/{{ fe.build.build_dir }}"
    if [ ! -d "$BUILD_DIR" ]; then
      echo "ERROR: Build directory not found: $BUILD_DIR"
      exit 1
    fi
    
    echo "빌드 파일 목록:"
    ls -la "$BUILD_DIR/"
    
    # 업로드할 파일 개수 확인
    FILE_COUNT=$(find "$BUILD_DIR" -type f | wc -l)
    echo "업로드할 파일 개수: $FILE_COUNT"
    
    UPLOAD_SUCCESS=false
    
    # 방법 1: gsutil rsync (전체 디렉토리 동기화)
    echo "=== 방법 1: gsutil rsync 시도 ==="
    if gsutil -m rsync -r -d "$BUILD_DIR/" "gs://{{ gcp.gcs.fe.bucket_name }}/" 2>/dev/null; then
      echo "✅ gsutil rsync 업로드 성공"
      UPLOAD_SUCCESS=true
    else
      echo "❌ gsutil rsync 실패"
    fi
    
    # 방법 2: gcloud storage rsync (신규 명령)  
    if [ "$UPLOAD_SUCCESS" = "false" ]; then
      echo "=== 방법 2: gcloud storage rsync 시도 ==="
      if gcloud storage rsync "$BUILD_DIR/" "gs://{{ gcp.gcs.fe.bucket_name }}/" --recursive --delete-unmatched-destination-objects 2>/dev/null; then
        echo "✅ gcloud storage rsync 업로드 성공"
        UPLOAD_SUCCESS=true
      else
        echo "❌ gcloud storage rsync 실패"
      fi
    fi
    
    # 방법 3: gsutil cp (기존 명령)
    if [ "$UPLOAD_SUCCESS" = "false" ]; then
      echo "=== 방법 3: gsutil cp 시도 ==="
      if gsutil -m cp -r "$BUILD_DIR/*" "gs://{{ gcp.gcs.fe.bucket_name }}/" 2>/dev/null; then
        echo "✅ gsutil cp 업로드 성공"
        UPLOAD_SUCCESS=true
      else
        echo "❌ gsutil cp 실패"
      fi
    fi
    
    # 방법 4: gcloud storage cp (신규 명령)
    if [ "$UPLOAD_SUCCESS" = "false" ]; then
      echo "=== 방법 4: gcloud storage cp 시도 ==="
      if gcloud storage cp -r "$BUILD_DIR/*" "gs://{{ gcp.gcs.fe.bucket_name }}/" 2>/dev/null; then
        echo "✅ gcloud storage cp 업로드 성공"
        UPLOAD_SUCCESS=true
      else
        echo "❌ gcloud storage cp 실패"
      fi
    fi
    
    # 방법 5: 개별 파일 업로드 (gsutil - 가장 안전한 방법)
    if [ "$UPLOAD_SUCCESS" = "false" ]; then
      echo "=== 방법 5: 개별 파일 업로드 시도 ==="
      cd "$BUILD_DIR"
      INDIVIDUAL_SUCCESS=true
      UPLOADED_COUNT=0
      
      # 모든 파일을 개별적으로 업로드
      find . -type f | while read -r file; do
        # 상대 경로에서 ./ 제거
        target_file="${file#./}"
        echo "업로드 중: $target_file"
        
        # MIME 타입 결정
        case "$target_file" in
          *.html) content_type="text/html" ;;
          *.css)  content_type="text/css" ;;
          *.js)   content_type="application/javascript" ;;
          *.json) content_type="application/json" ;;
          *.png)  content_type="image/png" ;;
          *.jpg|*.jpeg) content_type="image/jpeg" ;;
          *.svg)  content_type="image/svg+xml" ;;
          *.ico)  content_type="image/x-icon" ;;
          *)      content_type="application/octet-stream" ;;
        esac
        
        # gsutil로 개별 파일 업로드 (Content-Type 지정)
        if gsutil -h "Content-Type:$content_type" cp "$file" "gs://{{ gcp.gcs.fe.bucket_name }}/$target_file" 2>/dev/null; then
          echo "✅ 업로드 성공: $target_file"
          UPLOADED_COUNT=$((UPLOADED_COUNT + 1))
        else
          echo "❌ 업로드 실패: $target_file"
          INDIVIDUAL_SUCCESS=false
        fi
      done
      
      if [ "$INDIVIDUAL_SUCCESS" = "true" ] && [ "$UPLOADED_COUNT" -gt 0 ]; then
        echo "✅ 개별 파일 업로드 성공 ($UPLOADED_COUNT 개 파일)"
        UPLOAD_SUCCESS=true
      else
        echo "❌ 개별 파일 업로드 실패"
      fi
    fi
    
    # 업로드 결과 확인
    if [ "$UPLOAD_SUCCESS" = "true" ]; then
      echo "=== 업로드 완료 - 버킷 내용 확인 ==="
      echo "버킷의 파일 목록:"
      gsutil ls -la "gs://{{ gcp.gcs.fe.bucket_name }}/" 2>/dev/null | head -20 || \
      gcloud storage ls "gs://{{ gcp.gcs.fe.bucket_name }}/" --long --recursive 2>/dev/null | head -20 || \
      echo "버킷 내용 확인 실패 (업로드는 성공)"
      
      echo "=== 웹사이트 설정 확인 ==="
      gsutil web get "gs://{{ gcp.gcs.fe.bucket_name }}" || echo "웹사이트 설정 정보 없음"
      
      exit 0
    else
      echo "❌ 모든 업로드 방법 실패"
      echo "=== 디버그 정보 ==="
      echo "현재 gcloud 계정: $(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
      echo "현재 프로젝트: $(gcloud config get-value project)"
      echo "서비스 계정 파일 존재: $(test -f '{{ paths.secret }}/gcs-frontend-sa.json' && echo 'Yes' || echo 'No')"
      exit 1
    fi
  become: false
  register: upload_result
  failed_when: upload_result.rc != 0

- name: Invalidate CDN cache for immediate deployment
  shell: |
    # 환경변수 설정
    export GOOGLE_APPLICATION_CREDENTIALS="{{ paths.secret }}/gcs-frontend-sa.json"
    
    # CDN URL 맵 확인 후 캐시 무효화
    echo "CDN 캐시 무효화 시작..."
    
    # URL 맵 존재 여부 확인
    URL_MAP_NAME="{{ gcp.gcs.fe.bucket_name }}-urlmap"
    if gcloud compute url-maps describe $URL_MAP_NAME --global --quiet 2>/dev/null; then
      echo "URL 맵 발견: $URL_MAP_NAME"
      gcloud compute url-maps invalidate-cdn-cache $URL_MAP_NAME \
        --path "/*" --global --quiet
      echo "✅ CDN 캐시 무효화 완료"
    else
      echo "⚠️  URL 맵을 찾을 수 없음: $URL_MAP_NAME"
      echo "CDN이 설정되지 않았거나 다른 이름을 사용 중일 수 있습니다."
      # 다른 가능한 URL 맵 이름들 확인
      echo "사용 가능한 URL 맵들:"
      gcloud compute url-maps list --filter="name~'{{ gcp.gcs.fe.bucket_name }}'" --format="value(name)" || true
    fi
  become: false
  register: cache_invalidation_result
  ignore_errors: yes

- name: Display upload results
  debug:
    msg:
      - "✅ Frontend deployment completed successfully!"
      - "📦 Bucket: {{ gcp.gcs.fe.bucket_name }}"
      - "🌍 Frontend URL: https://{{ fe.api.domain }}"
      - "🌐 CDN IP: {{ gcp.gcs.fe.cdn_ip | default('Check Terraform outputs') }}"
      - "📊 Upload result: {{ upload_result.stdout_lines[-5:] | default(['Upload completed']) }}"
      - "🔄 Cache invalidation: {{ 'Success' if cache_invalidation_result.rc == 0 else 'Manual refresh may be needed' }}"

- name: Create deployment summary
  copy:
    dest: "{{ paths.log }}/fe_deployment_summary.txt"
    content: |
      Frontend GCS+CDN Deployment Summary (방법 1: 배포만 담당)
      =========================================================
      
      Deployment Time: {{ ansible_date_time.iso8601 }}
      Environment: {{ env }}
      
      Infrastructure (Terraform 관리):
      - GCS Bucket: {{ gcp.gcs.fe.bucket_name }} (이미 구축됨)
      - CDN: {{ gcp.gcs.fe.cdn_ip | default('Terraform outputs 확인') }}
      - Domain: {{ fe.api.domain }}
      - SSL: 자동 관리됨
      
      Application (Ansible 배포):
      - Source Repository: {{ project_repos.fe_url }}
      - Branch: {{ branch }}
      - Build Directory: {{ fe.build.build_dir }}
      - Build Command: {{ fe.build.build_command }}
      
      API Endpoints:
      - Backend API: {{ fe.api.backend_url }}
      - AI Service: {{ fe.api.ai_url }}
      - Frontend Domain: https://{{ fe.api.domain }}
      
      CDN Cache Invalidation: {{ 'Success' if cache_invalidation_result.rc == 0 else 'Manual refresh needed' }}
      Status: SUCCESS
    mode: "0644"
  become: true

- name: Setup logrotate for frontend deployment logs
  copy:
    dest: /etc/logrotate.d/fe_gcs_deploy
    content: |
      {{ paths.log }}/fe_gcs_deploy.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 {{ system.user }} {{ system.user }}
      }
    mode: "0644"
  become: true
