# Frontend GCS+CDN 배포 Role (단순화 버전 - Compute Engine 기본 서비스 계정 사용)
# Terraform에서 이미 구축된 GCS+CDN 인프라에 React 빌드 파일 배포

- name: Install required packages for frontend deployment
  apt:
    name:
      - curl
      - unzip
      - git
      - build-essential
    state: present
    update_cache: yes
  become: true

- name: Install Node.js 18.x (LTS)
  block:
    - name: Check if Node.js is already installed
      command: node --version
      register: node_check
      ignore_errors: yes

    - name: Add NodeSource repository for Node.js 18.x
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
      become: true
      when: node_check.rc != 0 or not node_check.stdout.startswith('v18')

    - name: Install Node.js and npm
      apt:
        name:
          - nodejs
        state: present
        update_cache: yes
      become: true
      when: node_check.rc != 0 or not node_check.stdout.startswith('v18')

- name: Install Google Cloud SDK
  block:
    - name: Check if gcloud is already installed
      command: which gcloud
      register: gcloud_check
      ignore_errors: yes

    - name: Add Google Cloud SDK repository
      shell: |
        echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
        curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
        sudo apt-get update
      become: true
      when: gcloud_check.rc != 0

    - name: Install Google Cloud CLI
      apt:
        name: google-cloud-cli
        state: present
        update_cache: yes
      become: true
      when: gcloud_check.rc != 0

- name: Clone frontend repository
  block:
    - name: Configure git safe directory
      git_config:
        name: safe.directory
        value: "{{ project_paths.fe_repo }}"
        scope: global
      become: true

    - name: Clone frontend repository
      git:
        repo: "{{ project_repos.fe_url }}"
        dest: "{{ project_paths.fe_repo }}"
        version: "{{ branch }}"
        force: yes
      become: true

- name: Fix S3 bucket name in constants.ts (임시 수정)
  replace:
    path: "{{ project_paths.fe_repo }}/src/constants.ts"
    regexp: "moongsan-dev-s3"
    replace: "{{ aws.s3.bucket }}"
    backup: yes
  become: true

- name: Ensure required directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
    mode: "0755"
  become: true
  loop:
    - "{{ paths.secret }}"
    - "{{ paths.log }}"
    - "{{ project_paths.fe_repo }}"

- name: Ensure frontend directory ownership
  file:
    path: "{{ project_paths.fe_repo }}"
    recurse: yes
    state: directory
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
  become: true

- name: Generate .env.production file for React
  template:
    src: react.env.j2
    dest: "{{ project_paths.fe_repo }}/{{ fe.build.env_file }}"
    mode: "0644"
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
  become: true
  when: fe.build.env_file is defined

- name: Override .env.prod file for environment-specific build
  template:
    src: react.env.j2
    dest: "{{ project_paths.fe_repo }}/.env.prod"
    mode: "0644"
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
  become: true

- name: Install frontend dependencies
  npm:
    path: "{{ project_paths.fe_repo }}"
    state: present
  become: true

- name: Build frontend project
  shell: "{{ fe.build.build_command }}"
  args:
    chdir: "{{ project_paths.fe_repo }}"
  register: fe_build_result
  failed_when: fe_build_result.rc != 0
  become: true

- name: Write build log
  copy:
    dest: "{{ paths.log }}/fe_gcs_deploy.log"
    content: |
      ===== Frontend Build Log =====
      Build Time: {{ ansible_date_time.iso8601 }}
      Command: {{ fe.build.build_command }}

      ===== STDOUT =====
      {{ fe_build_result.stdout }}

      ===== STDERR =====
      {{ fe_build_result.stderr }}
    mode: "0644"
  become: true

- name: Generate GCS service account key file (same as db_backup pattern)
  template:
    src: gcs-service-account.json.j2
    dest: "{{ paths.secret }}/gcs-frontend-sa.json"
    mode: "0644"
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
  become: true

- name: Upload built files to GCS bucket with optimized cache headers
  shell: |
    # 환경변수 설정 (db_backup과 동일 패턴)
    export GOOGLE_APPLICATION_CREDENTIALS="{{ paths.secret }}/gcs-frontend-sa.json"

    # 빌드 파일이 존재하는지 확인
    BUILD_DIR="{{ project_paths.fe_repo }}/{{ fe.build.build_dir }}"
    if [ ! -d "$BUILD_DIR" ]; then
      echo "ERROR: Build directory not found: $BUILD_DIR"
      exit 1
    fi

    echo "빌드 파일 목록:"
    find "$BUILD_DIR" -type f | head -10

    # 업로드할 파일 개수 확인
    FILE_COUNT=$(find "$BUILD_DIR" -type f | wc -l)
    echo "업로드할 파일 개수: $FILE_COUNT"

    # GCS 버킷을 완전히 정리 (기존 파일 삭제)
    echo "=== 기존 파일 정리 ==="
    gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
           -m rm -r "gs://{{ gcp.gcs.fe.bucket_name }}/*" 2>/dev/null || echo "버킷이 이미 비어있음"

    # 파일 타입별로 다른 캐시 헤더 설정하여 업로드
    echo "=== 최적화된 캐시 헤더로 업로드 ==="

    # 1. HTML 파일 (짧은 캐시, 매번 재검증)
    find "$BUILD_DIR" -name "*.html" -type f | while read file; do
      relative_path=${file#$BUILD_DIR/}
      echo "HTML 업로드: $relative_path"
      gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
             -h "Cache-Control: public, max-age=300, must-revalidate" \
             -h "Content-Type: text/html; charset=utf-8" \
             cp "$file" "gs://{{ gcp.gcs.fe.bucket_name }}/$relative_path"
    done

    # 2. JS/CSS 파일 (해시된 파일명이므로 긴 캐시)
    find "$BUILD_DIR" -name "*.js" -o -name "*.css" -type f | while read file; do
      relative_path=${file#$BUILD_DIR/}
      echo "Asset 업로드: $relative_path"
      gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
             -h "Cache-Control: public, max-age=31536000, immutable" \
             cp "$file" "gs://{{ gcp.gcs.fe.bucket_name }}/$relative_path"
    done

    # 3. 이미지 및 기타 정적 파일
    find "$BUILD_DIR" -type f ! -name "*.html" ! -name "*.js" ! -name "*.css" | while read file; do
      relative_path=${file#$BUILD_DIR/}
      echo "정적 파일 업로드: $relative_path"
      gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
             -h "Cache-Control: public, max-age=86400" \
             cp "$file" "gs://{{ gcp.gcs.fe.bucket_name }}/$relative_path"
    done

    # 전체 업로드 완료 후, 한번에 업로드하는 fallback 방법
    echo "=== 추가 rsync 업로드 (누락된 파일 방지) ==="
    if gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
       -m rsync -r -d -x '.*\.html$|.*\.js$|.*\.css$' "$BUILD_DIR/" "gs://{{ gcp.gcs.fe.bucket_name }}/"; then
      echo "✅ rsync 업로드 성공"
    else
      echo "⚠️  rsync 실패, 하지만 개별 파일 업로드는 완료됨"
    fi

    # 업로드 결과 확인
    echo "=== 업로드 완료 - 버킷 내용 확인 ==="
    echo "버킷의 파일 목록:"
    gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
           ls -la "gs://{{ gcp.gcs.fe.bucket_name }}/" | head -10

    echo "=== 웹사이트 설정 확인 ==="
    gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
           web get "gs://{{ gcp.gcs.fe.bucket_name }}" 2>/dev/null || echo "웹사이트 설정 정보 없음"
  become: false
  register: upload_result
  failed_when: upload_result.rc != 0

- name: Create 404.html for SPA routing (copy of index.html)
  shell: |
    # 환경변수 설정 (db_backup과 동일 패턴)
    export GOOGLE_APPLICATION_CREDENTIALS="{{ paths.secret }}/gcs-frontend-sa.json"

    BUILD_DIR="{{ project_paths.fe_repo }}/{{ fe.build.build_dir }}"

    echo "=== SPA 라우팅을 위한 404.html 생성 ==="
    echo "React SPA에서는 모든 라우트가 index.html을 통해 처리되어야 합니다."

    # index.html을 404.html로 복사 (로컬에서)
    if [ -f "$BUILD_DIR/index.html" ]; then
      sudo cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
      sudo chown lsh:lsh "$BUILD_DIR/404.html"
      echo "✅ 404.html 생성 완료 (index.html 복사)"
      
      # 404.html을 GCS에 업로드
      gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
             cp "$BUILD_DIR/404.html" "gs://{{ gcp.gcs.fe.bucket_name }}/404.html"
      echo "✅ 404.html GCS 업로드 완료"
      
      # 업로드 확인
      echo "=== 404.html 업로드 확인 ==="
      gsutil -o "Credentials:gs_service_key_file={{ paths.secret }}/gcs-frontend-sa.json" \
             stat "gs://{{ gcp.gcs.fe.bucket_name }}/404.html"
    else
      echo "❌ index.html 파일을 찾을 수 없습니다: $BUILD_DIR/index.html"
      exit 1
    fi
  become: false
  register: spa_routing_result
  failed_when: spa_routing_result.rc != 0

- name: Smart CDN cache invalidation with fallback
  shell: |
    # 환경변수 설정 (db_backup과 동일 패턴)
    export GOOGLE_APPLICATION_CREDENTIALS="{{ paths.secret }}/gcs-frontend-sa.json"

    echo "=== CDN 캐시 무효화 시작 ==="

    # gcloud 인증 설정
    gcloud auth activate-service-account --key-file="{{ paths.secret }}/gcs-frontend-sa.json" --quiet || true
    gcloud config set project {{ gcp.gcs.fe.project }} --quiet || true

    # 1단계: 프로젝트의 모든 URL 맵 조회
    echo "프로젝트의 URL 맵 조회 중..."
    URL_MAPS=$(gcloud compute url-maps list --format="value(name)" --filter="name~'{{ env }}'" 2>/dev/null | head -5)

    if [ -z "$URL_MAPS" ]; then
      echo "환경별 URL 맵을 찾지 못했습니다. 모든 URL 맵 조회 중..."
      URL_MAPS=$(gcloud compute url-maps list --format="value(name)" 2>/dev/null | head -5)
    fi

    echo "발견된 URL 맵들:"
    echo "$URL_MAPS"

    # 2단계: 각 URL 맵에 대해 캐시 무효화 시도
    SUCCESS=false
    for URL_MAP in $URL_MAPS; do
      echo "URL 맵 $URL_MAP에 대해 캐시 무효화 시도..."
      
      if gcloud compute url-maps invalidate-cdn-cache "$URL_MAP" \
         --path "/*" --global --quiet 2>/dev/null; then
        echo "✅ $URL_MAP 캐시 무효화 성공"
        SUCCESS=true
        # 첫 번째 성공 후 중단하지 않고 모든 URL 맵에 대해 시도
      else
        echo "⚠️  $URL_MAP 캐시 무효화 실패 (CDN이 연결되지 않았을 수 있음)"
      fi
    done

    # 3단계: 특정 경로 캐시 무효화 (HTML과 주요 asset)
    if [ "$SUCCESS" = true ]; then
      echo "=== 중요 파일별 캐시 무효화 ==="
      for URL_MAP in $URL_MAPS; do
        # HTML 파일들
        gcloud compute url-maps invalidate-cdn-cache "$URL_MAP" \
          --path "/index.html" --global --quiet 2>/dev/null || true
        gcloud compute url-maps invalidate-cdn-cache "$URL_MAP" \
          --path "/404.html" --global --quiet 2>/dev/null || true
        
        # 정적 asset 디렉토리
        gcloud compute url-maps invalidate-cdn-cache "$URL_MAP" \
          --path "/static/*" --global --quiet 2>/dev/null || true
      done
    fi

    if [ "$SUCCESS" = true ]; then
      echo "✅ CDN 캐시 무효화 완료"
      exit 0
    else
      echo "⚠️  모든 CDN 캐시 무효화 시도가 실패했습니다."
      echo "수동으로 다음 명령을 실행하세요:"
      echo "gcloud compute url-maps invalidate-cdn-cache [URL_MAP_NAME] --path '/*' --global"
      exit 1
    fi
  become: false
  register: cache_invalidation_result
  ignore_errors: yes

- name: Verify deployment with cache-busting check
  shell: |
    echo "=== 배포 검증 시작 ==="

    # 1. 빌드 시간 확인
    BUILD_TIME="{{ ansible_date_time.iso8601 }}"
    echo "빌드 시간: $BUILD_TIME"

    # 2. index.html에서 빌드 정보 확인
    sleep 5  # CDN 전파 대기
    echo "Frontend URL 접속 확인..."

    RESPONSE=$(curl -s -f "https://{{ fe.api.domain }}/" 2>/dev/null || echo "ERROR")
    if echo "$RESPONSE" | grep -q "VITE_APP_BUILD_TIME" 2>/dev/null; then
      echo "✅ 새로운 빌드가 정상적으로 배포되었습니다."
    elif echo "$RESPONSE" | grep -q "<html" 2>/dev/null; then
      echo "⚠️  HTML은 로드되지만 빌드 시간 확인 불가"
      echo "페이지가 로드되고 있습니다. 수동으로 확인해주세요."
    else
      echo "❌ 사이트 접속 실패 또는 빌드 미반영"
      echo "다음 URL을 직접 확인해주세요: https://{{ fe.api.domain }}/"
    fi

    # 3. 캐시 우회 URL로 재확인
    echo "캐시 우회 URL로 재확인..."
    CACHE_BYPASS_URL="https://{{ fe.api.domain }}/?cb=$(date +%s)"
    echo "캐시 우회 URL: $CACHE_BYPASS_URL"

    exit 0  # 검증 실패해도 배포는 성공으로 처리
  become: false
  register: deployment_verification
  ignore_errors: yes

- name: Display enhanced deployment results
  debug:
    msg:
      - "🎉 Frontend deployment completed successfully!"
      - "📦 Bucket: {{ gcp.gcs.fe.bucket_name }}"
      - "🌍 Frontend URL: https://{{ fe.api.domain }}"
      - "🌐 CDN IP: {{ gcp.gcs.fe.cdn_ip | default('Check Terraform outputs') }}"
      - "📊 Upload result: Success"
      - "🔄 Cache invalidation: {{ 'Success' if cache_invalidation_result.rc == 0 else 'Manual refresh needed' }}"
      - "✅ Deployment verification: Completed"
      - "🔗 Cache-bypass URL: https://{{ fe.api.domain }}/?cb={{ ansible_date_time.epoch }}"
      - "⏰ Build timestamp: {{ ansible_date_time.iso8601 }}"

- name: Create deployment summary
  copy:
    dest: "{{ paths.log }}/fe_deployment_summary.txt"
    content: |
      Frontend GCS+CDN Deployment Summary (단순화 버전)
      ===============================================

      Deployment Time: {{ ansible_date_time.iso8601 }}
      Environment: {{ env }}

      Infrastructure (Terraform 관리):
      - GCS Bucket: {{ gcp.gcs.fe.bucket_name }} (이미 구축됨)
      - CDN: {{ gcp.gcs.fe.cdn_ip | default('Terraform outputs 확인') }}
      - Domain: {{ fe.api.domain }}
      - SSL: 자동 관리됨

      Application (Ansible 배포):
      - Source Repository: {{ project_repos.fe_url }}
      - Branch: {{ branch }}
      - Build Directory: {{ fe.build.build_dir }}
      - Build Command: {{ fe.build.build_command }}
      - Authentication: Compute Engine Default Service Account

      API Endpoints:
      - Backend API: {{ fe.api.backend_url }}
      - AI Service: {{ fe.api.ai_url }}
      - Frontend Domain: https://{{ fe.api.domain }}

      CDN Cache Invalidation: {{ 'Success' if cache_invalidation_result.rc == 0 else 'Manual refresh needed' }}
      Status: SUCCESS
    mode: "0644"
  become: true

- name: Setup logrotate for frontend deployment logs
  copy:
    dest: /etc/logrotate.d/fe_gcs_deploy
    content: |
      {{ paths.log }}/fe_gcs_deploy.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 {{ system.user }} {{ system.user }}
      }
    mode: "0644"
  become: true
