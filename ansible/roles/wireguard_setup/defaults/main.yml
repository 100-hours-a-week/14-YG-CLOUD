# WireGuard 기본값 (중첩 구조)

wireguard:
  port: 51820
  interface: "wg0"
  network: "10.8.0.0/24"
  server_address: "10.8.0.1/24"
  dns: "8.8.8.8, 8.8.4.4"

  # 기본 클라이언트 목록 (환경별 설정에서 오버라이드)
  clients: []

  # 기본 허용 네트워크
  allowed_networks:
    - "10.8.0.0/24"

  # 서버 키 정보 (vault에서 가져옴)
  server_private_key: "{{ vault_wireguard_server_private_key | default('') }}"
  server_public_key: "{{ vault_wireguard_server_public_key | default('') }}"
