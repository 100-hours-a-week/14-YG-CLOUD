- name: Backup existing nginx default conf
  command: mv /etc/nginx/sites-available/default /etc/nginx/sites-available/default.bak
  ignore_errors: yes

- name: Step 1 - Deploy HTTP-only nginx config
  template:
    src: nginx_http_default.j2
    dest: /etc/nginx/sites-available/default
    force: yes
    backup: yes
    mode: "0644"

- name: Reload nginx (step 1)
  service:
    name: nginx
    state: reloaded

- name: Step 2 - Run certbot
  command: certbot --nginx -d {{ nginx.domain }} --non-interactive --agree-tos -m {{ nginx.ssl_email }}

- name: Step 3 - Deploy final HTTPS nginx config
  template:
    src: nginx_https_default.j2
    dest: /etc/nginx/sites-available/default
    force: yes
    mode: "0644"

- name: Ensure passlib (apt) is installed
  apt:
    name: python3-pip
    state: present
    update_cache: yes
  become: true

- name: Ensure passlib (full) is installed via pip
  pip:
    name: passlib
    state: latest
    executable: pip3
  become: true

- name: htpasswd 파일 생성 후 devuser 등록
  community.general.htpasswd:
    path: /etc/nginx/.htpasswd
    name: "{{ nginx.devuser }}"
    password: "{{ nginx.devuser_password }}"
    crypt_scheme: apr_md5_crypt
    state: present
  become: true

- name: Reload nginx
  service:
    name: nginx
    state: reloaded
