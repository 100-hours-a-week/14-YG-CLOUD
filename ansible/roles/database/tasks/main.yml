---
# Docker-based MySQL Database Setup
# 3-tier 아키텍처용 MySQL 데이터베이스 컨테이너 배포

- name: "Create MySQL configuration directory"
  file:
    path: "{{ db.mysql.container.config_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: "Create MySQL custom configuration for long polling support"
  template:
    src: my.cnf.j2
    dest: "{{ db.mysql.container.config_dir }}/custom.cnf"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: "Create MySQL data directory"
  file:
    path: "{{ db.mysql.container.data_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: "Stop any existing MySQL services"
  systemd:
    name: mysql
    state: stopped
  become: true
  ignore_errors: yes

- name: "Kill any MySQL processes using port 3306"
  shell: |
    fuser -k 3306/tcp || true
    pkill -f mysqld || true
  become: true
  ignore_errors: yes

- name: "Wait for port 3306 to be free"
  wait_for:
    port: 3306
    state: stopped
    timeout: 30
  ignore_errors: yes

- name: "Stop and remove any existing MySQL container"
  docker_container:
    name: "mysql-{{ service_name }}"
    state: absent
  become: true
  ignore_errors: yes

- name: "Run MySQL container with custom configuration"
  docker_container:
    name: "{{ db.mysql.container.name }}"
    image: "{{ db.mysql.container.image }}"
    state: started
    restart_policy: "{{ db.mysql.container.restart_policy }}"
    ports:
      - "{{ db.mysql.port }}:3306"
    volumes:
      - "{{ db.mysql.container.data_dir }}:/var/lib/mysql"
      - "{{ db.mysql.container.config_dir }}/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro"
    networks:
      - name: "{{ docker.network_name }}"
    env:
      MYSQL_ROOT_PASSWORD: "{{ db.mysql.root_password }}"
      MYSQL_DATABASE: "{{ database.name | default(db.mysql.name) }}"
      MYSQL_USER: "{{ db.mysql.user }}"
      MYSQL_PASSWORD: "{{ db.mysql.password }}"
      TZ: "{{ system.timezone | default('Asia/Seoul') }}"
  become: true

- name: "Wait for MySQL to be ready"
  wait_for:
    port: "{{ db.mysql.port | default('3306') }}"
    host: "{{ internal_ips.database | default('10.0.0.2') }}"
    delay: 10
    timeout: 300

- name: "Verify MySQL container is running"
  docker_container_info:
    name: "{{ db.mysql.container.name }}"
  register: mysql_container_info
  become: true

- name: "Display MySQL container status"
  debug:
    msg: "✅ MySQL container is {{ 'running' if mysql_container_info.container.State.Running else 'not running' }}"

- name: "Wait for MySQL configuration to be loaded"
  pause:
    seconds: 15
  when: mysql_container_info.container.State.Running

- name: "Verify max_connections setting"
  shell: |
    docker exec {{ db.mysql.container.name }} mysql -u {{ db.mysql.root_user }} -p{{ db.mysql.root_password }} \
    -e "SHOW VARIABLES LIKE 'max_connections';"
  register: max_connections_result
  become: true
  ignore_errors: yes

- name: "Display max_connections setting"
  debug:
    msg:
      - "🔧 MySQL max_connections 설정 확인:"
      - "{{ max_connections_result.stdout_lines if max_connections_result.stdout_lines is defined else 'Configuration check failed' }}"

- name: "Show current MySQL connection status"
  shell: |
    docker exec {{ db.mysql.container.name }} mysql -u {{ db.mysql.root_user }} -p{{ db.mysql.root_password }} \
    -e "SHOW STATUS LIKE 'Threads_connected';" \
    -e "SHOW STATUS LIKE 'Max_used_connections';"
  register: connection_status_result
  become: true
  ignore_errors: yes

- name: "Display connection status"
  debug:
    msg:
      - "📊 MySQL 연결 상태:"
      - "{{ connection_status_result.stdout_lines if connection_status_result.stdout_lines is defined else 'Status check failed' }}"
