- name: Check if AI repo already exists
  stat:
    path: "{{ project_paths.ai_repo }}"
  register: ai_repo_stat

- name: Clean uncommitted changes in AI repo (if exists)
  shell: |
    git reset --hard
    git clean -fd
  args:
    chdir: "{{ project_paths.ai_repo }}"
  when: ai_repo_stat.stat.exists

- name: Clone AI repo if not present
  git:
    repo: "{{ project_repos.ai_url }}"
    dest: "{{ project_paths.ai_repo }}"
    version: "{{ branch }}"
    update: yes
    force: yes
    accept_hostkey: yes

- name: Remove existing torch pin from requirements
  replace:
    path: /home/ubuntu/14-YG-AI/v1/requirements.txt
    regexp: "^torch==.*$"
    replace: ""
  become: true

- name: Ensure required Python packages are pinned in requirements.txt
  lineinfile:
    path: /home/ubuntu/14-YG-AI/v1/requirements.txt
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: EOF
    create: yes
  loop:
    - {regexp: "^PyYAML", line: "PyYAML>=6.0"}
    - {regexp: "^torch$", line: "torch>=2.2.0,<2.3.0"}
    - {regexp: "^torchvision$", line: "torchvision>=0.15.2,<0.16.0"}
    - {regexp: "^numpy$", line: "numpy<2"}
    - {regexp: "^opencv-python-headless$", line: "opencv-python-headless==4.9.0.80"}
    - {regexp: "^elastic-apm", line: "elastic-apm[flask]>=6.15.0"}

- name: Copy APM-enabled main.py to AI repo
  template:
    src: main.py.j2
    dest: "{{ project_paths.ai_repo }}/v1/app/main.py"
    mode: "0644"
  become: true

- name: Copy Dockerfile to AI repo
  template:
    src: Dockerfile.j2
    dest: "{{ project_paths.ai_repo }}/v1/Dockerfile"
    mode: "0644"
  become: true

- name: Get git commit hash for AI
  command: git rev-parse --short HEAD
  args:
    chdir: "{{ project_paths.ai_repo }}"
  register: ai_git_commit

- name: Set ai git commit fact
  set_fact:
    git_commit: "{{ ai_git_commit.stdout }}"

# 필요한 디렉토리들 생성
- name: Ensure required directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
    mode: "0755"
  loop:
    - "{{ paths.secret }}"
    - "{{ paths.log }}"
  become: true

# 환경 변수 + GCP 서비스 계정 키 파일을 템플릿에서 생성
- name: Generate .env file from template
  template:
    src: .env.j2
    dest: "{{ paths.secret }}/.env"
    mode: "0644"

- name: Generate GCP service account key file from template
  template:
    src: service-account.json.j2
    dest: "{{ paths.secret }}/{{ gcp.ai.credentials }}"
    mode: "0600"

# build 전 캐시/이미지 정리
- name: Prune unused Docker images (dangling only)
  shell: docker image prune -f
  become: true

- name: Prune Docker builder cache
  shell: docker builder prune -f
  become: true

# Docker build
- name: Build Docker image for AI
  shell: >
    docker build -t {{ ai.image }}:{{ ai.tag }} -f Dockerfile . > /tmp/ai_build.log 2>&1
  args:
    chdir: "{{ project_paths.ai_repo }}/v1"
  become: true

# DockerHub 로그인
- name: DockerHub 로그인
  shell: echo "{{ dockerhub.password }}" | docker login --username {{ dockerhub.username }} --password-stdin
  become: true

# Docker 이미지 푸시
- name: Push Docker image to registry
  shell: docker push {{ ai.image }}:{{ ai.tag }}
  become: true

# Docker 이미지 풀 (푸시 후 검증)
- name: Pull AI image from registry
  shell: docker pull {{ ai.image }}:{{ ai.tag }}
  become: true

- name: Ensure AI log directory exists
  file:
    path: "{{ paths.log }}"
    state: directory
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
    mode: "0755"

- name: Create AI log file if missing
  file:
    path: "{{ paths.log }}/ai_moongsan.log"
    state: touch
    owner: "{{ system.user }}"
    group: "{{ system.user }}"
    mode: "0644"

# Docker run
- name: Run AI container
  community.docker.docker_container:
    name: "{{ ai.container_name }}"
    image: "{{ ai.image }}:{{ ai.tag }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    env_file: "{{ paths.secret }}/.env"
    published_ports:
      - "{{ ai.port }}:{{ ai.port }}"
    volumes:
      - "{{ paths.log }}:{{ paths.log }}"
      - "{{ paths.secret }}:{{ paths.secret }}"

- name: Remove dangling images after deployment
  shell: docker image prune -f
  become: true

- name: Ensure logrotate config for ai_deploy ai exists
  copy:
    dest: /etc/logrotate.d/ai_moongsan
    content: |
      {{ paths.log }}/ai_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 {{ system.user }} {{ system.user }}
      }
  become: true
