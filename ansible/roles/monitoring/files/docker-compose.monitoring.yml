services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.1
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./filebeat-data:/usr/share/filebeat/data
      - /var/log:/var/log:ro
      - /home/ubuntu/logs:/home/ubuntu/logs:ro
    depends_on:
      - elasticsearch

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  node-exporter:
    image: prom/node-exporter

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=https://moongsan.com/grafana/

  k6:
    image: grafana/k6
    command: run --out prometheus=http://host.docker.internal:6565/api/v1/write /scripts/scenario_a.js
    volumes:
      - ./k6-scripts:/scripts

volumes:
  grafana-storage:
    name: grafana-storage
  prometheus-data:
    name: prometheus-data
  es-data:
    name: es-data
