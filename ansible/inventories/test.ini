# Test Environment Inventory - 3-Tier Architecture
# test-jumpbox를 통한 ProxyJump로 내부 서버 접근

[jumpbox]
test-jumpbox ansible_host=34.47.96.203 ansible_user=ubuntu

[backend]
test-backend ansible_host=10.0.0.3 ansible_user=ubuntu

[ai]
test-ai ansible_host=10.0.0.5 ansible_user=ubuntu

[database] 
test-database ansible_host=10.0.0.2 ansible_user=ubuntu

# 그룹 정의
[test:children]
jumpbox
backend
ai
database

[internal_servers:children]
backend
ai
database

[app_servers:children]
backend
ai

[data_servers:children]
database

# 변수 설정 - Jump Box를 통한 ProxyJump
[test:vars]
env=test
ansible_ssh_private_key_file=~/.ssh/lsh-study-key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Jump Box 변수
[jumpbox:vars]
service_name=jumpbox

# 내부 서버들은 Jump Box를 통해 접근 (SSH Agent forwarding 사용)
[internal_servers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ForwardAgent=yes -o ProxyJump=ubuntu@34.47.96.203'

[backend:vars]
service_port=8080
service_name=spring-backend

[ai:vars]
service_port=8100
service_name=fastapi-ai

[database:vars]
service_port=3306
service_name=mysql

# WireGuard VPN 설정 (각 서버의 VPN IP)
test-backend wireguard_ip=10.8.0.20
test-ai wireguard_ip=10.8.0.30
test-database wireguard_ip=10.8.0.40
