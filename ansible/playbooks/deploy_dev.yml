# 개발 환경 전체 배포 플레이북
#
# 사용법:
#   ansible-playbook -i inventory.ini playbooks/deploy_dev.yml
#   ansible-playbook -i inventory.ini playbooks/deploy_dev.yml --tags "base,database"
#
# 지원하는 태그:
#   - base: 기본 시스템 설정
#   - network: 네트워크 및 공통 서비스
#   - database: 데이터베이스 설정
#   - backend: 백엔드 서비스
#   - ai: AI 서비스
#   - nginx: 웹 서버 및 프록시
#   - backup: 백업 설정
#   - wireguard: VPN 설정

- name: "🚀 개발 환경 배포 시작"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 배포 환경 확인
      debug:
        msg:
          - "🎯 배포 환경: 개발(dev)"
          - "📅 배포 시간: {{ ansible_date_time.iso8601 }}"
          - "👤 실행 사용자: {{ ansible_user_id }}"

# 1단계: 기본 시스템 설정
- name: "1️⃣ 기본 시스템 설정 (dev)"
  hosts: dev
  become: yes
  roles:
    - base_system
  tags:
    - base
    - system

# 2단계: 네트워크 및 공통 설정
- name: "2️⃣ 공통 서비스 설정 (dev)"
  hosts: dev
  become: yes
  roles:
    - common
    - docker_net
  tags:
    - common
    - network

# 3단계: 데이터베이스 서버 설정
- name: "3️⃣ 데이터베이스 서버 설정 (dev)"
  hosts: dev:&database
  become: yes
  roles:
    - database
    - redis
  tags:
    - database
    - db

# 4단계: 백엔드 서버 설정
- name: "4️⃣ 백엔드 서비스 배포 (dev)"
  hosts: dev:&backend
  become: yes
  roles:
    - be_deploy
  tags:
    - backend
    - be

# 5단계: AI 서버 설정
- name: "5️⃣ AI 서비스 배포 (dev)"
  hosts: dev:&ai
  become: yes
  roles:
    - ai_deploy
  tags:
    - ai

# 6단계: Nginx 및 프록시 설정
- name: "6️⃣ Nginx 설정 (dev)"
  hosts: dev:&(backend:ai)
  become: yes
  roles:
    - nginx_conf
  tags:
    - nginx
    - proxy

# 7단계: 백업 설정
- name: "7️⃣ 백업 설정 (dev)"
  hosts: dev
  become: yes
  roles:
    - db_backup
  tags:
    - backup

# 8단계: WireGuard VPN 설정 (선택사항)
- name: "8️⃣ WireGuard VPN 설정 (dev)"
  hosts: dev:&shared
  become: yes
  roles:
    - wireguard_setup
  tags:
    - wireguard
    - vpn
    - never # 기본적으로 실행되지 않음 (명시적으로 태그 지정시만)

# 배포 완료 요약
- name: "✅ 개발 환경 배포 완료"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 배포 완료 알림
      debug:
        msg:
          - "🎉 개발 환경 배포가 완료되었습니다!"
          - "📊 배포된 호스트 수: {{ groups['dev'] | length }}"
          - "⏰ 완료 시간: {{ ansible_date_time.iso8601 }}"
          - ""
          - "📝 다음 단계:"
          - "  1. 서비스 상태 확인: ansible -i inventory.ini dev -m shell -a 'docker ps'"
          - "  2. 애플리케이션 테스트: 각 서비스 엔드포인트 확인"
          - "  3. 로그 확인: ansible -i inventory.ini dev -m shell -a 'docker logs <container>'"
