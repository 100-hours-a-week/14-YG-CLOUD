# 데이터베이스 수정/복구 플레이북
#
# 용도: 개발/테스트 환경의 데이터베이스 스키마 수정, 백업 복원 등
#
# 사용법:
#   ansible-playbook -i inventory.ini playbooks/dev_db_fix.yml -e "target=dev"
#   ansible-playbook -i inventory_test.ini playbooks/dev_db_fix.yml -e "target=test"
#
# 매개변수:
#   - target: 대상 그룹 (dev, test)
#
# ⚠️  주의: 프로덕션 환경에서는 사용하지 마세요!

- name: "🔧 데이터베이스 수정/복구 작업"
  hosts: "{{ target | default('dev') }}"
  become: yes

  pre_tasks:
    - name: 프로덕션 환경 체크
      fail:
        msg: "❌ 프로덕션 환경에서는 이 플레이북을 사용할 수 없습니다!"
      when: target is defined and target == 'prod'

    - name: 작업 대상 확인
      debug:
        msg:
          - "🎯 작업 대상: {{ target | default('dev') }}"
          - "📅 작업 시간: {{ ansible_date_time.iso8601 }}"
          - "⚠️  데이터베이스 수정 작업을 시작합니다"

    - name: 작업 확인 대기
      pause:
        prompt: |

          ⚠️  데이터베이스 수정 작업을 수행합니다.

          이 작업은 다음을 포함할 수 있습니다:
          • 백업 생성
          • 스키마 수정
          • 데이터 복원

          계속하려면 Enter를 누르세요 (취소: Ctrl+C)

  roles:
    - role: db_fix

  post_tasks:
    - name: 데이터베이스 상태 확인
      shell: "docker ps --filter 'name=database' --format 'table {{.Names}}\t{{.Status}}'"
      register: db_containers

    - name: 작업 완료 알림
      debug:
        msg:
          - "✅ 데이터베이스 수정 작업이 완료되었습니다"
          - "📊 데이터베이스 컨테이너 상태:"
        var: db_containers.stdout_lines
