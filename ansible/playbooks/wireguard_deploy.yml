# WireGuard 서버 배포 플레이북

- name: Deploy WireGuard VPN server
  hosts: "{{ target | default('shared') }}"
  become: yes

  # 변수는 group_vars에서 자동으로 로드됨
  # wireguard.* 형태의 중첩 구조 사용

  roles:
    - wireguard_setup

  tasks:
    - name: Display WireGuard status
      shell: wg show
      register: wg_status
      become: yes

    - name: Show WireGuard status
      debug:
        var: wg_status.stdout_lines

    - name: Display current WireGuard configuration summary
      debug:
        msg:
          - "✅ WireGuard 서버 주소: {{ wireguard.server_address }}"
          - "✅ 포트: {{ wireguard.port }}"
          - "✅ 인터페이스: {{ wireguard.interface }}"
          - "✅ 클라이언트 수: {{ wireguard.clients | length }}"
