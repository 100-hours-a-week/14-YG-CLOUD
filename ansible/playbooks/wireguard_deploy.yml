# WireGuard 서버 배포 플레이북

- name: Deploy WireGuard VPN server
  hosts: "{{ target | default('backend') }}"
  become: yes
  vars:
    # 환경별 설정은 group_vars에서 로드됨
    wireguard_port: "{{ wireguard.port | default(51820) }}"
    wireguard_server_address: "{{ wireguard.server_address | default('10.8.0.1/24') }}"
    wireguard_interface: "{{ wireguard.interface | default('wg0') }}"
    wireguard_server_private_key: "{{ wireguard.server_private_key }}"
    wireguard_server_public_key: "{{ wireguard.server_public_key }}"
    wireguard_clients: "{{ wireguard.clients | default([]) }}"

  roles:
    - wireguard_setup

  tasks:
    - name: Display WireGuard status
      shell: wg show
      register: wg_status
      become: yes

    - name: Show WireGuard status
      debug:
        var: wg_status.stdout_lines
