# 공유 인프라 배포 플레이북 (WireGuard VPN, Jumpbox 등)
#
# 사용법:
#   ansible-playbook -i inventory.ini playbooks/deploy_shared.yml
#   ansible-playbook -i inventory.ini playbooks/deploy_shared.yml --tags "wireguard"
#   ansible-playbook -i inventory_test.ini playbooks/deploy_shared.yml --tags "wireguard"
#
# 지원하는 태그:
#   - base: 기본 시스템 설정
#   - wireguard: WireGuard VPN 설정
#   - backup: 백업 설정

- name: "🔒 공유 인프라 배포 시작"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 배포 환경 확인
      debug:
        msg:
          - "🎯 배포 대상: 공유 인프라(shared)"
          - "📅 배포 시간: {{ ansible_date_time.iso8601 }}"
          - "👤 실행 사용자: {{ ansible_user_id }}"

# 1단계: 기본 시스템 설정
- name: "1️⃣ 기본 시스템 설정 (shared)"
  hosts: shared
  become: yes
  roles:
    - base_system
  tags:
    - base
    - system

# 2단계: WireGuard VPN 설정 (메인 기능)
- name: "2️⃣ WireGuard VPN 서버 설정"
  hosts: shared
  become: yes
  roles:
    - wireguard_setup
  tags:
    - wireguard
    - vpn

  post_tasks:
    - name: WireGuard 서비스 상태 확인
      systemd:
        name: "wg-quick@{{ wireguard.interface }}"
      register: wg_service_status

    - name: WireGuard 인터페이스 상태 확인
      shell: "ip addr show {{ wireguard.interface }}"
      register: wg_interface_status
      failed_when: false

    - name: 현재 활성 피어 확인
      shell: "wg show {{ wireguard.interface }} peers"
      register: wg_peers
      failed_when: false

    - name: WireGuard 설정 요약
      debug:
        msg:
          - "✅ WireGuard 서비스: {{ wg_service_status.status.ActiveState }}"
          - "✅ 인터페이스: {{ wireguard.interface }}"
          - "✅ 서버 주소: {{ wireguard.server_address }}"
          - "✅ 포트: {{ wireguard.port }}"
          - "✅ 활성 피어 수: {{ wg_peers.stdout_lines | length if wg_peers.rc == 0 else 0 }}"

# 3단계: 백업 설정
- name: "3️⃣ 백업 설정 (shared)"
  hosts: shared
  become: yes
  roles:
    - db_backup
  tags:
    - backup

# 배포 완료 요약
- name: "✅ 공유 인프라 배포 완료"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 배포 완료 알림
      debug:
        msg:
          - "🎉 공유 인프라 배포가 완료되었습니다!"
          - "📊 배포된 호스트 수: {{ groups['shared'] | length }}"
          - "⏰ 완료 시간: {{ ansible_date_time.iso8601 }}"
          - ""
          - "📝 WireGuard 클라이언트 설정:"
          - "  1. 클라이언트 설정 파일: wireguard-team-keys/ 디렉토리 확인"
          - "  2. 클라이언트 연결 테스트: ping {{ wireguard.server_address.split('/')[0] }}"
          - ""
          - "📝 다음 단계:"
          - "  1. VPN 연결 테스트"
          - "  2. 방화벽 규칙 확인"
          - "  3. 클라이언트 설정 배포"
