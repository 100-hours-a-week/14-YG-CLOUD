---
# MySQL Database Deployment - Docker Based
# 3-tier 아키텍처를 위한 Docker 기반 MySQL 데이터베이스 배포

- name: "🗄️ Deploy MySQL Database with Docker"
  hosts: database
  become: yes
  gather_facts: yes
  
  vars:
    env: "test"
    
  pre_tasks:
    - name: "Display deployment information"
      debug:
        msg: |
          🗄️ MySQL Database Deployment Starting
          Server: {{ inventory_hostname }}
          Environment: {{ env }}
          MySQL Version: 8.0
          Container Name: mysql-{{ service_name }}
        
  roles:
    - database
      
  post_tasks:
    - name: "Test MySQL connection"
      shell: |
        docker exec mysql-{{ service_name }} mysql -u{{ db.user | default('moongsan_admin') }} -p{{ db.password | default('N4pT!6xuV2#rLm3z') }} -e "SELECT 1 as connection_test;"
      register: mysql_test
      ignore_errors: yes
      become: true
      
    - name: "Display deployment results"
      debug:
        msg: |
          ✅ MySQL Database Deployment Complete!
          
          📊 Container Details:
          - Name: mysql-{{ service_name }}
          - Image: mysql:8.0
          - Port: 3306
          - Network: {{ docker.network_name | default('moongsan-net') }}
          - Database: {{ database.name | default('moongsan_app') }}
          - User: {{ db.user | default('moongsan_admin') }}
          
          🔍 Connection Test: {{ 'PASSED' if mysql_test.rc == 0 else 'FAILED' }}
          
          🌐 Connection Info:
          - Internal IP: {{ internal_ips.database | default('10.0.0.2') }}:3306
          - Docker Network: {{ docker.network_name | default('moongsan-net') }}
          
          📝 Next Steps:
          1. Test connectivity from backend server
          2. Deploy backend application
          3. Verify end-to-end connection
