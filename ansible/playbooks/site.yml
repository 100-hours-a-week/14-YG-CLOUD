---
# 전체 인프라 배포 플레이북 (개선된 버전)

# 1단계: 모든 서버에 기본 시스템 설정
- name: Setup base system on all servers
  hosts: all
  become: yes
  roles:
    - base_system
  tags:
    - base
    - system

# 2단계: 네트워크 및 공통 설정
- name: Setup common services
  hosts: all
  become: yes
  roles:
    - common
    - docker_net
  tags:
    - common
    - network

# 3단계: 데이터베이스 서버 설정
- name: Setup database servers
  hosts: database
  become: yes
  roles:
    - database
    - redis
  tags:
    - database
    - db

# 4단계: Backend 서버 설정
- name: Deploy backend services
  hosts: backend
  become: yes
  roles:
    - be_deploy
  tags:
    - backend
    - be

# 5단계: AI 서버 설정
- name: Deploy AI services
  hosts: ai
  become: yes
  roles:
    - ai_deploy
  tags:
    - ai

# 6단계: Nginx 및 프록시 설정
- name: Configure Nginx
  hosts: backend:ai
  become: yes
  roles:
    - nginx_conf
  tags:
    - nginx
    - proxy

# 7단계: 백업 및 모니터링 설정
- name: Setup backup
  hosts: all
  become: yes
  roles:
    - db_backup
  tags:
    - backup
