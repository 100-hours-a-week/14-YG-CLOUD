# 전체 인프라 배포 마스터 플레이북
#
# 이 플레이북은 모든 환경에서 사용할 수 있는 범용 배포 플레이북입니다.
# 환경별 전용 플레이북(deploy_dev.yml, deploy_test.yml, deploy_prod.yml)을 우선 사용하는 것을 권장합니다.
#
# 사용법:
#   ansible-playbook -i inventory.ini playbooks/site.yml -e "env=dev"
#   ansible-playbook -i inventory_test.ini playbooks/site.yml -e "env=test"
#   ansible-playbook -i inventory_prod.ini playbooks/site.yml -e "env=prod"
#   ansible-playbook -i inventory.ini playbooks/site.yml --tags "base,database"
#
# 매개변수:
#   - env: 대상 환경 (dev, test, prod, all) - 기본값: all
#
# 지원하는 태그:
#   - base: 기본 시스템 설정
#   - network: 네트워크 및 공통 서비스
#   - database: 데이터베이스 설정
#   - backend: 백엔드 서비스
#   - ai: AI 서비스
#   - nginx: 웹 서버 및 프록시
#   - backup: 백업 설정

- name: "🌐 전체 인프라 배포 시작"
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    target_env: "{{ env | default('all') }}"
  tasks:
    - name: 배포 환경 확인
      debug:
        msg:
          - "🎯 배포 환경: {{ target_env }}"
          - "📅 배포 시간: {{ ansible_date_time.iso8601 }}"
          - "👤 실행 사용자: {{ ansible_user_id }}"
          - ""
          - "⚠️  권장사항: 환경별 전용 플레이북 사용"
          - "  • 개발: ansible-playbook playbooks/deploy_dev.yml"
          - "  • 테스트: ansible-playbook playbooks/deploy_test.yml"
          - "  • 프로덕션: ansible-playbook playbooks/deploy_prod.yml"

# 1단계: 모든 서버에 기본 시스템 설정
- name: "1️⃣ 기본 시스템 설정"
  hosts: "{{ env | default('all') }}"
  become: yes
  roles:
    - base_system
  tags:
    - base
    - system

# 2단계: 네트워크 및 공통 설정
- name: "2️⃣ 공통 서비스 설정"
  hosts: "{{ env | default('all') }}"
  become: yes
  roles:
    - common
    - docker_net
  tags:
    - common
    - network

# 3단계: 데이터베이스 서버 설정
- name: "3️⃣ 데이터베이스 서버 설정"
  hosts: "{{ env | default('all') }}:&database"
  become: yes
  roles:
    - database
    - redis
  tags:
    - database
    - db

# 4단계: Backend 서버 설정
- name: "4️⃣ 백엔드 서비스 배포"
  hosts: "{{ env | default('all') }}:&backend"
  become: yes
  roles:
    - be_deploy
  tags:
    - backend
    - be

# 5단계: AI 서버 설정
- name: "5️⃣ AI 서비스 배포"
  hosts: "{{ env | default('all') }}:&ai"
  become: yes
  roles:
    - ai_deploy
  tags:
    - ai

# 6단계: Nginx 및 프록시 설정
- name: "6️⃣ Nginx 설정"
  hosts: "{{ env | default('all') }}:&(backend:ai)"
  become: yes
  roles:
    - nginx_conf
  tags:
    - nginx
    - proxy

# 7단계: 백업 및 모니터링 설정
- name: "7️⃣ 백업 설정"
  hosts: "{{ env | default('all') }}"
  become: yes
  roles:
    - db_backup
  tags:
    - backup

# 배포 완료 요약
- name: "✅ 전체 인프라 배포 완료"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 배포 완료 알림
      debug:
        msg:
          - "🎉 전체 인프라 배포가 완료되었습니다!"
          - "🎯 대상 환경: {{ env | default('all') }}"
          - "⏰ 완료 시간: {{ ansible_date_time.iso8601 }}"
