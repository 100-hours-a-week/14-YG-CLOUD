# 🚀 프론트엔드 전용 배포 플레이북
#
# 사용법:
#   ansible-playbook -i test.ini playbooks/frontend-only.yml -e "env=test"

- name: "🎯 프론트엔드 배포 시작"
  hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
    - name: 배포 환경 정보 표시
      debug:
        msg:
          - "🎯 배포 환경: {{ env | upper }}"
          - "📅 배포 시간: {{ ansible_date_time.iso8601 }}"
          - "🚀 프론트엔드 전용 배포 시작"

# 프론트엔드 배포 (gcs+cdn)
- name: "🎨 프론트엔드 GCS 배포"
  hosts: jumpbox
  become: yes
  gather_facts: yes
  tasks:
    - name: React 프론트엔드 GCS 배포
      include_role:
        name: fe_gcs_deploy
      when: env is defined and env in ['test', 'prod']

# 배포 완료 요약
- name: "✅ 프론트엔드 배포 완료"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: 배포 완료 알림
      debug:
        msg:
          - "🎉 프론트엔드 배포가 완료되었습니다!"
          - "⏰ 완료 시간: {{ ansible_date_time.iso8601 }}"
          - "🌐 Frontend URL: https://test.moongsan.com"
          - "📦 GCS Bucket: moongsan-test-frontend"
