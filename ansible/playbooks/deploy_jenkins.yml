---
- name: Deploy Jenkins on AWS EC2
  hosts: jenkins_servers
  become: yes
  gather_facts: yes
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: /Users/lsh/.ssh/id_ed25519 # Corrected private key path

  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Include Jenkins role
      ansible.builtin.include_role:
        name: jenkins
