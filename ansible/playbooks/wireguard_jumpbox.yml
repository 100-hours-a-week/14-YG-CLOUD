# WireGuard jumpbox 설정 플레이북

- name: Setup WireGuard on jumpbox
  hosts: "{{ target | default('backend') }}"
  become: yes
  vars:
    # Jumpbox용 특별 설정
    wireguard_port: "{{ wireguard.port | default(51820) }}"
    wireguard_server_address: "{{ wireguard.server_address | default('10.8.0.1/24') }}"
    wireguard_interface: "{{ wireguard.interface | default('wg0') }}"
    wireguard_server_private_key: "{{ wireguard.server_private_key }}"
    wireguard_server_public_key: "{{ wireguard.server_public_key }}"
    wireguard_clients: "{{ wireguard.clients | default([]) }}"

  pre_tasks:
    - name: Check if WireGuard is already installed
      shell: which wg
      register: wg_check
      failed_when: false
      changed_when: false

    - name: Display WireGuard installation status
      debug:
        msg: "WireGuard {{ 'is already installed' if wg_check.rc == 0 else 'will be installed' }}"

  roles:
    - wireguard_setup

  post_tasks:
    - name: Generate client configuration files
      template:
        src: client.conf.j2
        dest: "/tmp/{{ client.name }}-client.conf"
        mode: "0600"
      loop: "{{ wireguard_clients }}"
      loop_control:
        loop_var: client
      when: wireguard_clients | length > 0

    - name: Display generated client configs
      debug:
        msg: "Client config generated for {{ client.name }} at /tmp/{{ client.name }}-client.conf"
      loop: "{{ wireguard_clients }}"
      loop_control:
        loop_var: client
      when: wireguard_clients | length > 0
