---
# Connectivity Test Playbook
# 3-tier 아키텍처 간 연결성 테스트

- name: "Test 3-Tier Architecture Connectivity"
  hosts: test
  gather_facts: yes
  
  vars:
    env: "test"
    
  tasks:
    - name: "Test internal network connectivity"
      shell: ping -c 3 {{ item }}
      loop:
        - "{{ internal_ips.database }}"
        - "{{ internal_ips.backend }}"
        - "{{ internal_ips.ai }}"
      register: ping_results
      ignore_errors: yes
      when: inventory_hostname != item
      
    - name: "Test MySQL connectivity from backend"
      shell: |
        docker run --rm --network {{ docker.network_name }} mysql:8.0 \
        mysql -h {{ internal_ips.database }} -P {{ db.port }} \
        -u {{ db.user }} -p{{ db.password }} \
        -e "SELECT 1 as test_connection;"
      register: mysql_test
      ignore_errors: yes
      when: "'backend' in group_names"
      
    - name: "Test backend API from AI server"
      uri:
        url: "http://{{ internal_ips.backend }}:{{ be.port }}/actuator/health"
        method: GET
        timeout: 10
      register: backend_api_test
      ignore_errors: yes
      when: "'ai' in group_names"
      
    - name: "Test AI service from backend"
      uri:
        url: "http://{{ internal_ips.ai }}:{{ ai.port }}/health"
        method: GET
        timeout: 10
      register: ai_api_test
      ignore_errors: yes
      when: "'backend' in group_names"
      
    - name: "Show connectivity test results"
      debug:
        msg: |
          🔍 Connectivity Test Results for {{ inventory_hostname }}:
          {% if ping_results is defined %}
          Network Ping: {{ 'PASS' if ping_results.failed == false else 'FAIL' }}
          {% endif %}
          {% if mysql_test is defined %}
          MySQL Connection: {{ 'PASS' if mysql_test.failed == false else 'FAIL' }}
          {% endif %}
          {% if backend_api_test is defined %}
          Backend API: {{ 'PASS' if backend_api_test.failed == false else 'FAIL' }}
          {% endif %}
          {% if ai_api_test is defined %}
          AI Service: {{ 'PASS' if ai_api_test.failed == false else 'FAIL' }}
          {% endif %}
