# WireGuard VPN 서버 배포 플레이북
#
# ⚠️  중요: WireGuard 서버는 shared-jumpbox에만 설치됩니다!
#
# 사용법:
#   WireGuard 서버 배포: ansible-playbook wireguard_playbook.yml
#   (항상 shared-jumpbox에 배포됨)

- import_playbook: playbooks/wireguard_deploy.yml
  vars:
    target: "shared"

- name: WireGuard 배포 후 검증
  hosts: "shared"
  become: yes
  tasks:
    - name: WireGuard 서비스 상태 확인
      systemd:
        name: wg-quick@wg0
      register: wg_service_status

    - name: WireGuard 인터페이스 상태 확인
      shell: ip addr show {{ wireguard.interface }}
      register: wg_interface_status
      failed_when: false

    - name: 연결된 피어 확인
      shell: wg show {{ wireguard.interface }} peers
      register: wg_peers
      failed_when: false

    - name: 배포 결과 요약
      debug:
        msg:
          - "🎯 WireGuard 서버: shared-jumpbox (34.47.100.211)"
          - "✅ WireGuard 서비스: {{ wg_service_status.status.ActiveState }}"
          - "✅ WireGuard 인터페이스: {{ 'UP' if wg_interface_status.rc == 0 else 'DOWN' }}"
          - "✅ 서버 주소: {{ wireguard.server_address }}"
          - "✅ 포트: {{ wireguard.port }}"
          - "✅ 활성 피어 수: {{ wg_peers.stdout_lines | length if wg_peers.rc == 0 else 0 }}"
          - "✅ 연결된 피어 수: {{ wg_peers.stdout_lines | length if wg_peers.rc == 0 else 0 }}"

    - name: 연결된 피어 목록
      debug:
        var: wg_peers.stdout_lines
      when: wg_peers.rc == 0 and wg_peers.stdout_lines | length > 0
