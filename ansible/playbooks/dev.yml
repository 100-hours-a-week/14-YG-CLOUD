# 🚀 Development 환경 전용 플레이북
#
# Dev 환경 배포:
#   ansible-playbook -i dev.ini playbooks/dev.yml
#
# 태그 기반 선택적 배포:
#   --tags "base"       # 기본 시스템만
#   --tags "database"   # 데이터베이스만
#   --tags "backend"    # 백엔드 서비스만
#   --tags "ai"         # AI 서비스만
#   --tags "frontend"   # 프론트엔드만
#
# 예시:
#   ansible-playbook -i dev.ini playbooks/dev.yml --tags "backend"
#   ansible-playbook -i dev.ini playbooks/dev.yml --tags "backend,ai"

# 배포 시작 알림
- name: "🚀 Dev 환경 배포 시작"
  hosts: localhost
  connection: local
  gather_facts: yes
  tasks:
    - name: Dev 배포 환경 정보 표시
      debug:
        msg:
          - "🎯 배포 환경: DEV"
          - "📅 배포 시간: {{ ansible_date_time.iso8601 }}"
          - "👤 실행 사용자: {{ ansible_user_id }}"
          - "🖥️ 대상 호스트: {{ groups['dev'] }}"
          - "📦 단일 서버 배포 모드"

# Dev 환경 단일 서버 배포
- name: "🚀 Dev 환경 단일 서버 배포"
  hosts: dev
  become: yes
  gather_facts: yes
  tags:
    - all
  tasks:
    - name: Dev 배포 시작 알림
      debug:
        msg:
          - "🎯 Dev 환경 단일 서버 배포를 시작합니다"
          - "🖥️ 대상 서버: {{ ansible_host }}"
          - "📅 시작 시간: {{ ansible_date_time.iso8601 }}"

    # 기본 시스템 설정
    - name: 기본 시스템 설정
      import_role:
        name: common
      tags: ["common", "base", "system"]

    # 14-YG-CLOUD 레포지토리 클론
    - name: 14-YG-CLOUD 레포 클론
      import_role:
        name: clone_cloud
      tags: ["clone_cloud"]

    # Docker 네트워크 설정
    - name: Docker 네트워크 설정
      import_role:
        name: docker_net
      tags: ["docker_net", "network"]

    # Nginx 설정 (SSL 포함)
    - name: Nginx 설정
      import_role:
        name: nginx_conf
      tags: ["nginx", "web"]

    # 데이터베이스 설정
    - name: MySQL 데이터베이스 설정
      import_role:
        name: database
      tags: ["db", "database", "data"]

    # Redis 설정
    - name: Redis 설정
      import_role:
        name: redis
      tags: ["redis", "cache"]

    # Backend 배포
    - name: Backend 서비스 배포
      import_role:
        name: be_deploy
      tags: ["be", "backend", "be_deploy", "api"]

    # AI 서비스 배포
    - name: AI 서비스 배포
      import_role:
        name: ai_deploy
      tags: ["ai", "ai_deploy", "ml"]

    # Frontend 배포
    - name: Frontend 배포
      import_role:
        name: fe_deploy
      tags: ["fe", "frontend", "fe_deploy", "web"]

    # 데이터베이스 백업 설정
    - name: 데이터베이스 백업 설정
      import_role:
        name: db_backup
      tags: ["db_backup", "backup"]

    # Kafka 클러스터 설정 (dev는 단일 노드)
    - name: Kafka 클러스터 설정
      import_role:
        name: kafka_cluster
      tags: ["kafka", "streaming"]

    - name: Dev 배포 완료 알림
      debug:
        msg:
          - "✅ Dev 환경 배포가 완료되었습니다!"
          - "🌍 Frontend: https://dev.moongsan.com"
          - "🔧 Backend: https://dev.moongsan.com/api"
          - "🤖 AI Service: https://dev.moongsan.com/ai"

# 배포 완료 요약
- name: "✅ Dev 배포 완료"
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Dev 배포 완료 알림
      debug:
        msg:
          - "🎉 DEV 환경 배포가 완료되었습니다!"
          - "⏰ 완료 시간: {{ ansible_date_time.iso8601 }}"
          - ""
          - "📋 배포된 서비스 (단일 서버):"
          - "  🗄️ Database: dev.moongsan.com:3306"
          - "  🔧 Backend: dev.moongsan.com:8080"
          - "  🤖 AI Service: dev.moongsan.com:8100"
          - "  🌍 Frontend: https://dev.moongsan.com"
          - ""
          - "🔗 주요 URL:"
          - "  • Frontend: https://dev.moongsan.com"
          - "  • Backend API: https://dev.moongsan.com/api"
          - "  • AI Service: https://dev.moongsan.com/ai"
          - ""
          - "🔗 다음 단계:"
          - "  1. 서비스 상태 확인: ansible -i dev.ini dev -m shell -a 'docker ps'"
          - "  2. 백엔드 로그: ansible -i dev.ini dev -m shell -a 'docker logs be-moongsan'"
          - "  3. AI 로그: ansible -i dev.ini dev -m shell -a 'docker logs ai-moongsan'"
          - "  4. 프론트엔드 확인: curl -I https://dev.moongsan.com"
