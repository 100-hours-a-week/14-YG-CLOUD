# ===================================================================
# DEV 환경: 단일 서버 배포 (GitHub 버전과 호환)
# ===================================================================

# Dev 환경 단일 서버 배포
- name: "🚀 Dev 환경 단일 서버 배포"
  hosts: dev
  become: yes
  gather_facts: yes
  tags:
    - dev
    - single
  tasks:
    - name: Dev 배포 시작 알림
      debug:
        msg:
          - "🎯 Dev 환경 단일 서버 배포를 시작합니다"
          - "🖥️ 대상 서버: {{ ansible_host }}"
          - "📅 시작 시간: {{ ansible_date_time.iso8601 }}"

    # 기본 시스템 설정
    - name: 기본 시스템 설정
      include_role:
        name: common
      tags: ["common"]

    # 14-YG-CLOUD 레포지토리 클론
    - name: 14-YG-CLOUD 레포 클론
      include_role:
        name: clone_cloud
      tags: ["clone_cloud"]

    # Nginx 설정 (SSL 포함)
    - name: Nginx 설정
      include_role:
        name: nginx_conf
      tags: ["nginx"]

    # 데이터베이스 설정
    - name: MySQL 데이터베이스 설정
      include_role:
        name: database
      tags: ["db"]

    # Backend 배포
    - name: Backend 서비스 배포
      include_role:
        name: be_deploy
      tags: ["be"]

    # AI 서비스 배포
    - name: AI 서비스 배포
      include_role:
        name: ai_deploy
      tags: ["ai"]

    # Frontend 배포
    - name: Frontend 배포
      include_role:
        name: fe_deploy
      tags: ["fe"]

    # 데이터베이스 백업 설정
    - name: 데이터베이스 백업 설정
      include_role:
        name: db_backup
      tags: ["db_backup"]

    # Redis 설정
    - name: Redis 설정
      include_role:
        name: redis
      tags: ["redis"]

    # Docker 네트워크 설정
    - name: Docker 네트워크 설정
      include_role:
        name: docker_net
      tags: ["docker_net"]

    - name: Dev 배포 완료 알림
      debug:
        msg:
          - "✅ Dev 환경 배포가 완료되었습니다!"
          - "🌍 Frontend: https://dev.moongsan.com"
          - "🔧 Backend: https://dev.moongsan.com/api"
          - "🤖 AI Service: https://dev.moongsan.com/ai"

# ===================================================================

# 배포 완료 요약
- name: "✅ 통합 배포 완료"
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    deployment_env: "{{ groups.keys() | select('match', '^(dev|test|prod)$') | list | first | default('test') }}"
  tasks:
    - name: 배포 완료 알림
      debug:
        msg:
          - "🎉 {{ deployment_env | upper }} 환경 배포가 완료되었습니다!"
          - "⏰ 완료 시간: {{ ansible_date_time.iso8601 }}"
          - ""
          - "📋 배포된 서비스:"
          - "  🗄️  Database: {{ hostvars[groups['database'][0]]['ansible_host'] if 'database' in groups else 'N/A' }}:3306"
          - "  🔧 Backend: {{ hostvars[groups['backend'][0]]['ansible_host'] if 'backend' in groups else 'N/A' }}:8080"
          - "  🤖 AI Service: {{ hostvars[groups['ai'][0]]['ansible_host'] if 'ai' in groups else 'N/A' }}:8100"
          - "  🌍 Frontend: https://{{ hostvars[groups['jumpbox'][0]]['nginx']['domain'] if 'jumpbox' in groups else 'N/A' }} (GCS + CDN)"
          - ""
          - "🔗 주요 URL:"
          - "  • Frontend: https://{{ hostvars[groups['jumpbox'][0]]['nginx']['domain'] if 'jumpbox' in groups else 'test.moongsan.com' }}"
          - "  • Backend API: https://{{ hostvars[groups['jumpbox'][0]]['nginx']['domain'] if 'jumpbox' in groups else 'test.moongsan.com' }}/api"
          - "  • AI Service: https://{{ hostvars[groups['jumpbox'][0]]['nginx']['domain'] if 'jumpbox' in groups else 'test.moongsan.com' }}/ai"
          - ""
          - "🔗 다음 단계:"
          - "  1. 서비스 상태 확인: ansible -i {{ deployment_env }}.ini {{ deployment_env }} -m shell -a 'docker ps'"
          - "  2. 백엔드 로그: ansible -i {{ deployment_env }}.ini backend -m shell -a 'docker logs be-moongsan'"
          - "  3. AI 로그: ansible -i {{ deployment_env }}.ini ai -m shell -a 'docker logs ai-moongsan'"
          - "  4. 프론트엔드 확인: curl -I https://{{ hostvars[groups['jumpbox'][0]]['nginx']['domain'] if 'jumpbox' in groups else 'test.moongsan.com' }}"
