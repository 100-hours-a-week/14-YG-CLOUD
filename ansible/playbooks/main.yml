# 🚀 통합 배포 플레이북 (모든 환경 지원)
#
# 전체 배포:
#   ansible-playbook -i dev.ini playbooks/main.yml
#   ansible-playbook -i test.ini playbooks/main.yml
#   ansible-playbook -i prod.ini playbooks/main.yml
#
# 태그 기반 선택적 배포:
#   --tags "base"       # 기본 시스템만
#   --tags "database"   # 데이터베이스만
#   --tags "backend"    # 백엔드 서비스만
#   --tags "ai"         # AI 서비스만
#   --tags "frontend"   # 프론트엔드만 (GCS + CDN)
#   --tags "cdn"        # CDN 캐시 무효화만
#
# 예시:
#   ansible-playbook -i test.ini playbooks/main.yml --tags "frontend"
#   ansible-playbook -i test.ini playbooks/main.yml --tags "backend,ai"

# 배포 시작 알림
- name: "🚀 통합 배포 시작"
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    # 인벤토리에서 환경 정보 추출
    deployment_env: "{{ groups.keys() | select('match', '^(dev|test|prod)$') | list | first | default('unknown') }}"
  tasks:
    - name: 배포 환경 정보 표시
      debug:
        msg:
          - "🎯 배포 환경: {{ deployment_env | upper }}"
          - "📅 배포 시간: {{ ansible_date_time.iso8601 }}"
          - "👤 실행 사용자: {{ ansible_user_id }}"
          - "🖥️  대상 호스트: {{ groups[deployment_env] if deployment_env in groups else 'N/A' }}"

# 환경별 조건부 실행
- name: "환경 검증"
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    deployment_env: "{{ groups.keys() | select('match', '^(dev|test|prod)$') | list | first | default('unknown') }}"
  tasks:
    - name: 환경 변수 검증
      assert:
        that:
          - deployment_env != 'unknown'
          - deployment_env in ['dev', 'test', 'prod']
        fail_msg: "❌ 올바른 환경 그룹이 인벤토리에 정의되지 않았습니다. dev, test, 또는 prod 그룹이 필요합니다."
        success_msg: "✅ 환경 검증 완료: {{ deployment_env }}"

# 1단계: 기본 시스템 설정
- name: "1️⃣ 기본 시스템 설정"
  hosts: internal_servers
  become: yes
  gather_facts: yes
  tags:
    - base
    - system
  tasks:
    - name: 기본 시스템 구성
      include_role:
        name: base_system

    - name: 공통 설정 적용
      include_role:
        name: common

# 2단계: 데이터베이스 배포 (Test 환경의 database 그룹)
- name: "2️⃣ 데이터베이스 배포"
  hosts: database
  become: yes
  gather_facts: yes
  tags:
    - database
    - data
  tasks:
    - name: Docker 네트워크 설정
      include_role:
        name: docker_net
      when: "'database' in group_names"

    - name: MySQL 데이터베이스 설정
      include_role:
        name: database
      when: "'database' in group_names"

    - name: 데이터베이스 백업 설정
      include_role:
        name: db_backup
      when: "'database' in group_names"

# 3단계: 백엔드 서비스 배포
- name: "3️⃣ 백엔드 서비스 배포"
  hosts: backend
  become: yes
  gather_facts: yes
  tags:
    - be_deploy
    - backend
    - be
    - api
  tasks:
    - name: Docker 네트워크 설정
      include_role:
        name: docker_net
      when: "'backend' in group_names"

    - name: Redis 캐시 서버 배포
      include_role:
        name: redis
      when: "'backend' in group_names"

    - name: MongoDB 설정
      include_role:
        name: mongo
      when: "'backend' in group_names"

    - name: 소스코드 클론
      include_role:
        name: clone_cloud
      when: "'backend' in group_names"

    - name: Spring Boot 백엔드 배포
      include_role:
        name: be_deploy
      when: "'backend' in group_names"

# 4단계: AI 서비스 배포
- name: "4️⃣ AI 서비스 배포"
  hosts: ai
  become: yes
  gather_facts: yes
  tags:
    - ai_deploy
    - ai
    - ml
  tasks:
    - name: AI 서비스 배포
      include_role:
        name: ai_deploy
      when: "'ai' in group_names"

# 5단계: 프론트엔드 배포 (gcs+cdn)
- name: "5️⃣ 프론트엔드 배포 (GCS + CDN)"
  hosts: jumpbox
  become: yes
  gather_facts: yes
  vars:
    deployment_env: "{{ groups.keys() | select('match', '^(dev|test|prod)$') | list | first | default('test') }}"
  tags:
    - fe_deploy
    - frontend
    - fe
    - web
    - gcs
    - cdn
  tasks:
    - name: "🚀 Frontend 배포 시작"
      debug:
        msg:
          - "🎯 배포 환경: {{ deployment_env | upper }}"
          - "📅 배포 시간: {{ ansible_date_time.iso8601 }}"
          - "👤 실행 사용자: {{ ansible_user_id }}"
          - "🌐 도메인: {{ nginx.domain }}"
          - "📦 GCS 버킷: {{ gcp.gcs.fe.bucket_name }}"
          - "🔗 CDN IP: {{ gcp.gcs.fe.cdn_ip }}"

    - name: "🏗️ React 프론트엔드 GCS 배포"
      include_role:
        name: fe_gcs_deploy
      vars:
        # 로컬에서 빌드하고 GCS에 업로드
        build_host: localhost
      when: deployment_env in ['test', 'prod']

    - name: "✅ Frontend 배포 완료 알림"
      debug:
        msg:
          - "🎉 Frontend 배포가 완료되었습니다!"
          - "🌍 사이트 URL: https://{{ nginx.domain }}"
          - "📊 CDN IP: {{ gcp.gcs.fe.cdn_ip }}"
          - "🔄 캐시 무효화도 완료되었습니다."
          - "🔗 Cache-bypass URL: https://{{ nginx.domain }}/?cb={{ ansible_date_time.epoch }}"
      when: deployment_env in ['test', 'prod']

# 6단계: 연결성 테스트 (Test 환경만)
