---
# AI Service Deployment Playbook
# FastAPI AI 서비스 배포

- name: "Deploy AI Service"
  hosts: ai
  become: yes
  gather_facts: yes
  
  vars:
    env: "test"
    
  pre_tasks:
    - name: "Show AI service deployment start"
      debug:
        msg: "🤖 Starting AI service deployment on {{ inventory_hostname }}"
        
  tasks:
    - name: "Setup base system"
      include_role:
        name: base_system
      tags: [base]
      
    - name: "Setup common configurations"
      include_role:
        name: common
      tags: [common]
      
    - name: "Setup Docker network"
      include_role:
        name: docker_net
      tags: [docker, network]
      
    - name: "Clone source code"
      include_role:
        name: clone_cloud
      tags: [source, git]
      
    - name: "Deploy AI service"
      include_role:
        name: ai_deploy
      tags: [ai, fastapi]
      
  post_tasks:
    - name: "Verify AI container status"
      docker_container_info:
        name: "{{ ai.container_name }}"
      register: ai_info
      become: true
      ignore_errors: yes
      
    - name: "Show AI deployment result"
      debug:
        msg: |
          ✅ AI Service Deployment Complete!
          Container Name: {{ ai.container_name }}
          Status: {{ 'Running' if ai_info.container.State.Running else 'Stopped' }}
          Port: {{ ai.port }}
          Image: {{ ai.image }}:{{ ai.tag }}
