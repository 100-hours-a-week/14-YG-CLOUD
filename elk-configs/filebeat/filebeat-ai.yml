###################### Filebeat Configuration Example #########################

# ============================== Filebeat inputs ===============================

filebeat.inputs:

# 시스템 로그
- type: log
  enabled: true
  paths:
    - /var/log/syslog
    - /var/log/auth.log
    - /var/log/daemon.log
  fields:
    logtype: system
    server: ai
  fields_under_root: true

# AI 애플리케이션 로그
- type: log
  enabled: true
  paths:
    - /var/moongsan/log/ai_moongsan.log
  fields:
    logtype: application
    server: ai
    service: ai-service
  fields_under_root: true
  multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
  multiline.negate: true
  multiline.match: after

# Docker 컨테이너 로그
- type: container
  enabled: true
  paths:
    - /var/lib/docker/containers/*/*.log
  fields:
    logtype: docker
    server: ai
  fields_under_root: true

# ============================== Filebeat modules ===============================

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# ================================== Outputs ===================================

# Configure what output to use when sending the data collected by the beat.

# ------------------------------ Logstash Output -------------------------------
output.logstash:
  hosts: ["10.100.0.4:5044"]

# ================================= Processors =================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# ================================== Logging ===================================

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# ============================= X-Pack Monitoring ==============================
monitoring.enabled: false
