# NodeSource 저장소 추가
- name: Add NodeSource for Node.js 18
  shell: curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
  args:
    executable: /bin/bash
  become: true

# Node.js 18 설치
- name: Install Node.js 18 (includes npm)
  apt:
    name: nodejs
    state: present
  become: true

- name: Run apt update (once)
  apt:
    name:
      - nginx
      - mysql-server
      - openjdk-21-jdk
      - python3-pip
      - git
      - curl
      - certbot
      - python3-certbot-nginx
      - python3.11-venv
      - unzip
    state: present
    update_cache: yes
  retries: 5
  delay: 15
  register: result
  until: result is succeeded
  become: true

- name: Install Python packages
  pip:
    name:
      - fastapi
      - uvicorn
    state: present
    executable: pip3

- name: Install PyMySQL for Ansible MySQL modules
  pip:
    name: PyMySQL
    executable: pip3

# 디스크 정리 작업 추가

- name: Clean up APT cache and remove unused packages
  apt:
    autoclean: yes
    autoremove: yes
  become: true

- name: Remove downloaded Chrome .deb file
  file:
    path: /tmp/google-chrome.deb
    state: absent
  become: true

- name: Ensure /tmp directory permissions are secure
  file:
    path: /tmp
    state: directory
    mode: "1777"
  become: true

- name: Clean up old journal logs (older than 3 days)
  command: journalctl --vacuum-time=3d
  become: true
  failed_when: false
  ignore_errors: yes

- name: Install TypeScript globally
  npm:
    name: typescript
    global: yes
  become: true

- name: Ensure logs directory exists
  file:
    path: /home/ubuntu/logs
    state: directory
    mode: "0755"
    owner: ubuntu
    group: ubuntu
