#     executable: /bin/bash

- name: Deploy FastAPI systemd service
  template:
    src: fastapi.service.j2
    dest: /etc/systemd/system/fastapi.service
  become: true

- name: Reload systemd to recognize new service
  systemd:
    daemon_reload: yes
  become: true

- name: Enable and start FastAPI service
  systemd:
    name: fastapi
    enabled: yes
    state: started
  become: true

- name: Ensure ai log file is readable
  file:
    path: /home/ubuntu/logs/ai_moongsan.log
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Ensure logrotate config for aitest ai exists
  copy:
    dest: /etc/logrotate.d/ai_moongsan
    content: |
      /home/ubuntu/logs/ai_moongsan.log {
          weekly
          rotate 4
          compress
          delaycompress
          missingok
          notifempty
          create 0644 ubuntu ubuntu
      }
  become: true
