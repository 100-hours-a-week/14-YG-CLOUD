- name: Generate .env file from template
  template:
    src: .env.j2
    dest: /home/ubuntu/14-YG-AI/.env
    mode: "0644"

- name: Generate GCP service account key file from template
  template:
    src: service-account.json.j2
    dest: /home/ubuntu/14-YG-AI/deft-observer-456807-c5-e9dda0532301.json
    mode: "0600"

# 3.10 버전 오류나서 3.11 직접 설치
- name: Ensure python3.11-venv is installed
  apt:
    name:
      - python3.11
      - python3.11-venv
      - python3.11-distutils
    state: present
  become: true

- name: Create Python virtual environment
  shell: python3 -m venv .venv
  args:
    chdir: /home/ubuntu/14-YG-AI
    creates: /home/ubuntu/14-YG-AI/.venv

# --- inserted block: download and install pip manually if needed ---
- name: Download get-pip.py
  get_url:
    url: https://bootstrap.pypa.io/get-pip.py
    dest: /home/ubuntu/14-YG-AI/get-pip.py

- name: Install pip in virtualenv via get-pip.py
  command: /home/ubuntu/14-YG-AI/.venv/bin/python get-pip.py
  args:
    chdir: /home/ubuntu/14-YG-AI

- name: Remove get-pip.py after installation
  file:
    path: /home/ubuntu/14-YG-AI/get-pip.py
    state: absent

- name: Install Python dependencies from requirements.txt
  pip:
    requirements: requirements.txt
    executable: /home/ubuntu/14-YG-AI/.venv/bin/pip
  args:
    chdir: /home/ubuntu/14-YG-AI

# 기존 uvicorn 프로세스 종료
- name: Kill existing uvicorn process on port 8100 if exists
  shell: |
    PID=$(lsof -ti tcp:8100) && [ -n "$PID" ] && kill -9 $PID || true
  ignore_errors: yes

