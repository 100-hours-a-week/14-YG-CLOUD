- name: Ensure .gitignore excludes local-only secret files
  lineinfile:
    path: /home/ubuntu/14-YG-AI/.gitignore
    line: "{{ item }}"
    regexp: "^{{ item | regex_escape() }}$"
    state: present
    create: yes
  loop:
    - ".env"
    - "deft-observer-456807-c5-e9dda0532301.json"

# --- Load AI environment variables before generating .env file ---
- name: Load AI environment variables
  include_vars:
    file: "{{ playbook_dir }}/group_vars/ai_var.yml"

