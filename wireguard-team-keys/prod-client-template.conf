# Production Environment Client Configuration
# WireGuard 클라이언트 설정 (prod 환경 접근용)

[Interface]
# 클라이언트 개인키 (실제 사용시 개인별로 다른 키 사용)
PrivateKey = YOUR_PRIVATE_KEY_HERE
Address = 10.8.0.XX/32  # 개인별 할당된 IP (10.8.0.10~40 범위)

# DNS 설정 (선택사항)
DNS = 8.8.8.8, 8.8.4.4

[Peer]
# WireGuard 서버 (shared-jumpbox)
PublicKey = mCZW8+aQ3Q9J9H7PwvmCqTR2y8vX5kL9jN3mP1qR2A8=
Endpoint = 34.22.110.81:51820
PersistentKeepalive = 25

# 허용된 IP 범위 - test와 prod 환경 모두 포함
AllowedIPs = 10.0.0.0/16, 10.1.0.0/16, 10.8.0.0/24

# 설명:
# - 10.0.0.0/16: test 환경 네트워크
# - 10.1.0.0/16: prod 환경 네트워크  
# - 10.8.0.0/24: WireGuard VPN 네트워크

# 사용법:
# 1. YOUR_PRIVATE_KEY_HERE를 개인 프라이빗 키로 교체
# 2. 10.8.0.XX를 개인에게 할당된 IP로 교체
# 3. 파일을 개인별 이름으로 저장 (예: john-prod-client.conf)
# 4. sudo wg-quick up john-prod-client.conf
